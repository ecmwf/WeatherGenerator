include:
  - remote: 'https://gitlab.com/cscs-ci/recipes/-/raw/master/templates/v2/.ci-ext.yml'

stages:
  - single-integration-test

test_job:
  stage: single-integration-test
  extends: .uenv-runner-santis-gh200
  image: prgenv-gnu/25.6:v2
  script: |
    ml gcc/14.2.0

    PRIVATE_REPO_BRANCH="${PRIVATE_REPO_BRANCH:-main}"

    git clone \
      --branch "$PRIVATE_REPO_BRANCH" \
      https://oauth2:${PRIVATE_REPO_TOKEN}@gitlab.jsc.fz-juelich.de/esde/WeatherGenerator-private.git

    cd WeatherGenerator-private
  variables:
    SLURM_JOB_NUM_NODES: 1
    UV_CACHE_DIR: /capstor/store/cscs/userlab/ch17/uv_cache_shared/
