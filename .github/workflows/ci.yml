name: CI

on:
  push:
    branches: [ "main", "develop", "develop-ssl-diffusion-performance" ]
  pull_request:
    branches: [ "main", "develop", "develop-ssl-diffusion-performance" ]
    paths-ignore:
      - "CHANGELOG.md"
      - "README.md"

jobs:
  linting:
    name: linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Install a specific version of uv.
          version: "0.11.8"

      - name: Run ruff (black)
        # Do not attempt to install the default dependencies, this is much faster.
        # Run temporarily on a sub directory before the main restyling.
        run: ./scripts/actions.sh lint-check

      - name: TOML checks
        run: ./scripts/actions.sh toml-check

      - name: Type checker (pyrefly, experimental)
        # Do not attempt to install the default dependencies, this is much faster.
        # Run temporarily on a sub directory before the main restyling.
        run: ./scripts/actions.sh type-check
  pr:
    name: PR checks
    # Only for pull requests: the check needs a PR number, which pushes do not have.
    # Not for develop-ssl-diffusion-performance, whose PRs need no linked issue.
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref != 'develop-ssl-diffusion-performance'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Install a specific version of uv.
          version: "0.11.8"

      - name: Check PR is linked to an issue
      # Send the PR number to the script, which will check if it is linked to an issue.
        run: scripts/check_gh_issue.py $GITHUB_REF_NAME
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Install a specific version of uv.
          version: "0.11.8"

      - name: Run all unit tests
      # Send the PR number to the script, which will check if it is linked to an issue.
        run: ./scripts/actions.sh unit-test
