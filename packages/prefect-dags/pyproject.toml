[project]
name = "weathergen-prefect-dags"
version = "0.1.0"
description = "Prefect flows for the WeatherGenerator project."
requires-python = ">=3.12,<3.13"
dependencies = [
    # TODO: remove the dependency on weathergen-common-core once the code is migrated to this package.
    "weathergen-common-core",
    "prefect>=3.7.0",
    "paramiko>=3.1",
    "pyfirecrest>=3.7",
    "dacite",
]

[tool.uv.sources]
weathergen-common-core = { workspace = true }

[dependency-groups]
dev = [
 "pytest>=8.3",
 "pytest-mock>=3.14.1",
 "ruff==0.9.7",
 "pyrefly==0.36.0",
]


[tool.pyrefly]
project-includes = ["src/"]
project-excludes = [
]

[tool.pyrefly.errors]
bad-argument-type = false
unsupported-operation = false
missing-attribute = false
no-matching-overload = false
bad-context-manager = false




# The linting configuration
[tool.ruff]

# Wide rows
line-length = 100

[tool.ruff.lint]
# All disabled until the code is formatted.
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Banned imports
    "TID",
    # Naming conventions
    "N",
    # print
    "T201"
]

# These rules are sensible and should be enabled at a later stage.
ignore = [
  # "B006",
  "B011",
  "UP008",
  "SIM117",
  "SIM118",
  "SIM102",
  "SIM401",
  # To ignore, not relevant for us
  "SIM108", # in case additional norm layer supports are added in future
  "N817", # we use heavy acronyms, e.g., allowing 'import LongModuleName as LMN' (LMN is accepted)
  "E731", # overly restrictive and less readable code
  "N812", # prevents us following the convention for importing torch.nn.functional as F
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numpy.ndarray".msg = "Do not use 'ndarray' to describe a numpy array type, it is a function. Use numpy.typing.NDArray or numpy.typing.NDArray[np.float32] for example"

[tool.ruff.format]
# Use Unix `\n` line endings for all files
line-ending = "lf"

[tool.prefect]
# Show DEBUG-level logs from Prefect itself
logging.level = "INFO"

# Also capture all logs from the "weathergen" package
logging.extra_loggers = "weathergen"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weathergen"]
