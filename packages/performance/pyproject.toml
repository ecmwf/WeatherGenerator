[project]
name = "weathergen-performance"
version = "0.1.0"
description = "Performance analysis tools for WeatherGenerator"
readme = "README.md"

requires-python = ">=3.12,<3.13"
dependencies = [
    "polars~=1.25.2",
    "pandas~=2.2",
    "matplotlib",
    "pyarrow>=23.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/performance"]

[project.scripts]
extract_scaling_data = "performance.extract_scaling_data:main"
generate_scaling_plots = "performance.generate_scaling_plots:main"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "N"
]
