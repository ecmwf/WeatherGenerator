[project]
name = "weathergen-latent-decoder"
version = "0.1.0"
description = "Train simple decoders on stored WeatherGenerator latent states"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "torch",
    "zarr>=3.1",
    "astropy-healpix",
]

[dependency-groups]
dev = [
 "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weathergen"]
