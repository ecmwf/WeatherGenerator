# CSCS Santis paths for train_latent_decoder; everything else comes from default_config.yml.
#   train_latent_decoder --config <this file> --options results_path=./runs/try1

# sdnbfpve latents, 2023: 183 runs of 8 inits (every 6 h), copied from ECMWF
latents_path: /capstor/store/cscs/userlab/ch17/latents/2023

stream:
  filenames: ['/capstor/store/cscs/userlab/ch17/data/observations-ea-ofb-0001-1979-2025-combined-surface-v5.zarr']

data_loading:
  # one CPU core per worker; a Santis GH200 node has 288 cores, the README's reference used 16
  num_workers: 16
