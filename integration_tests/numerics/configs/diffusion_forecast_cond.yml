# Numerics test: latent diffusion forecasting conditioned on the encoded previous input step,
# with the conditioning tokens concatenated along the sequence (mirrors
# config_diffusion_d2048_forecast_concat.yml of develop-ssl-diffusion-v1 at tiny scale)

ae_local_num_blocks: 0

fe_diffusion_model: True
with_step_conditioning: True
fe_diffusion_model_conditioning: "forecast"
fe_diffusion_model_conditioning_type: "concatenate"
frequency_embedding_dim: 256
# must be 512: the noise conditioning in model/layers.py hard-codes noise_emb_dim=512
embedding_dim: 512
sigma_min: 0.002
sigma_max: 80
sigma_data: 0.7855
rho: 7
p_mean: -1.2
p_std: 1.2

training_config:
  training_mode: ["masking", "student_teacher"]

  losses : {
    "physical": {
        type: LossPhysical,
        weight: 0.0,
        loss_fcts: {
          "mse": {},
        },
        target_and_aux_calc: "Physical",
    },
    "latent_diff": {
        type: LossLatentDiffusion,
        weight: 1.0,
        target_and_aux_calc: DiffusionLatentTargetEncoder,
        loss_fcts: { "mse": { }, },
        }
  }

  model_input: {
    "forecasting" : {
      masking_strategy: "forecast",
      masking_strategy_config: {diffusion_rn: True},
      # the older input step is the conditioning
      num_steps_input: 2,
      num_samples: 1
      }
    }

  target_input: {
    "forecasting" : {
      masking_strategy: "forecast",
      masking_strategy_config: {diffusion_rn: True},
      num_steps_input: 1,
      num_samples: 1
      }
    }

  forecast :
      time_step: 06:00:00
      num_steps: 1
      offset: 0
      policy: "fixed"
