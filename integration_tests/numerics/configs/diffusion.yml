# Numerics test: latent diffusion forecasting (mirrors config_diffusion_tiny.yml of
# develop-ssl-diffusion-v1 at tiny scale, without checkpoint loading and module freezing)

ae_local_num_blocks: 0

with_step_conditioning: True
diffusion:
  enabled: True
  frequency_embedding_dim: 256
  # must be 512: the noise conditioning in model/layers.py hard-codes noise_emb_dim=512
  embedding_dim: 512
  sigma_data: 0.7855
  # inference sampler; sigma range derived from the training noise level distribution
  # (masking_strategy_config.noise_level of the target strategy)
  sampler:
    rho: 7

training_config:
  training_mode: ["masking", "student_teacher"]

  losses : {
    "physical": {
        type: LossPhysical,
        weight: 0.0,
        loss_fcts: {
          "mse": {},
        },
        target_and_aux_calc: "Physical",
    },
    "latent_diff": {
        type: LossLatentDiffusion,
        weight: 1.0,
        target_and_aux_calc: DiffusionLatentTargetEncoder,
        loss_fcts: { "mse": { }, },
        }
  }

  # no target_input: the target strategy is a copy of model_input
  model_input: {
    "forecasting" : {
      masking_strategy: "forecast",
      masking_strategy_config: {
        # distribution of the diffusion noise level sigma, one draw per sample
        noise_level: {distribution: "log_normal", p_mean: -1.2, p_std: 1.2},
        },
      num_samples: 1
      }
    }

  forecast :
      time_step: 06:00:00
      num_steps: 1
      offset: 0
      policy: "fixed"
