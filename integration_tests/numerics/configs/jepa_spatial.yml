# Numerics test: spatial JEPA with physical loss (mirrors space_jepa_pretraining of
# weathergen-configs at tiny scale). context_loss warmup is 0 so that the context loss
# contributes to the gradient at step 0.

ae_aggregation_num_blocks: 1
num_register_tokens: 4
qk_norm_type: "RMSNorm"

training_config:
  training_mode: ["masking", "student_teacher"]

  deep_ssl:
    enabled: true
    tap_after:
      - local2global
      - "global:0"
      - "global:1"
    fusion_hidden_factor: 4
    level_weights: [0.25, 0.25, 0.25, 0.25]

  context_loss:
    enabled: true
    weight: 0.4
    warmup_steps: 0

  window_offset_prediction : 0

  losses : {
    "physical": {
        enabled: True,
        type: LossPhysical,
        weight: 1.0,
        loss_fcts: { "mse": { target_source_correspondence: {0 : {0 : "subset"} },}, },
    },
    "student-teacher": {
        enabled: True,
        type: LossLatentSSLStudentTeacher,
        weight: 1.0,
        loss_fcts : {
          "JEPA": {
            'weight': 4, "loss_extra_args": {}, "out_dim": 128, "head": transformer,
            "num_blocks": 1, "num_heads": 4, "with_qk_lnorm": True, "intermediate_dim": 64,
            "dropout_rate": 0.0,
            target_source_correspondence: {0 : {0 : "subset"} },
        },
        },
        target_and_aux_calc: { "EMATeacher" :
          { ema_ramp_up_ratio : null,
            ema_halflife_in_thousands: 400000,
            model_param_overrides : {
              training_config: { losses: { student-teacher:{ loss_fcts :{JEPA: {head: identity} }}}}
            },
          }
        }
      }
  }

  model_input: {
    "random_easy" : {
      masking_strategy: "random",
      num_samples: 1,
      num_steps_input: 1,
      masking_strategy_config : {
        diffusion_rn : True,
        rate : 0.2,
        rate_sampling: False
      },
    },
  }

  target_input: {
    "random_easy_target" : {
      masking_strategy: "cropping_healpix",
      num_samples: 1,
      masking_strategy_config : { rate : 0.7, hl_mask: 3, rate_sampling: False },
    },
  }

  forecast :
    time_step: 00:00:00
    num_steps: 0
    policy: null
