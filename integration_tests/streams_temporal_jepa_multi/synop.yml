SurfaceCombined:
  type: obs
  stream_id: 2
  filenames: ['observations-ea-ofb-0001-1979-2023-combined-surface-v2.zarr']
  loss_weight: 1.0
  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 64
  tokenize_spacetime: True
  max_num_targets: -1
  masking_override:
    model_input:
      masking_strategy: random
      masking_strategy_config:
        rate: 0.45
        rate_sampling: false
    target_input:
      masking_strategy: forecast
      masking_strategy_config:
        rate: 1.0
        rate_sampling: false
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 2
    dim_embed: 32
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 32
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1