# LeJEPA config: student sees time t, target view (same encoder, with grad) sees time t+1.
# No EMA teacher — both views share the same encoder and both carry gradients.
# Loss = invariance (MSE) + SIGReg regularization to prevent collapse.

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 1024
ae_local_num_blocks: 4
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 2
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 8
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 7

fe_num_blocks: 6
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: []
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5
rope_2D: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ""

norm_type: "LayerNorm"
zarr_store: "zip"

#####################################

streams_directory: "./config/streams/era5_1deg/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

  collapse_monitoring:
    enabled: true
    compute_frequency: 100
    log_frequency: 100
    metrics:
      effective_rank:
        enabled: true
        tensor_source: "both"
        sample_size: 2048
        forecast_aggregation: "all"
      singular_values:
        enabled: true
        tensor_source: "both"
        sample_size: 2048
        forecast_aggregation: "all"
      dimension_variance:
        enabled: true
        tensor_source: "both"
        forecast_aggregation: "all"
      prototype_entropy:
        enabled: false
      ema_beta:
        enabled: false

data_loading:
  num_workers: 12
  rng_seed: ???

training_config:
  training_mode: ["student_teacher"]

  collapse_monitoring:
    enabled: true
    compute_frequency: 100
    log_frequency: 100
    metrics:
      effective_rank:
        enabled: true
        tensor_source: "both"
        sample_size: 2048
        forecast_aggregation: "all"
      singular_values:
        enabled: true
        tensor_source: "both"
        sample_size: 2048
        forecast_aggregation: "all"
      dimension_variance:
        enabled: true
        tensor_source: "both"
        forecast_aggregation: "all"
      prototype_entropy:
        enabled: false
      ema_beta:
        enabled: false

  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  teacher_time_offset: 1

  window_offset_prediction: 0

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    adamw:
      beta1: 0.975
      beta2: 0.9875
      eps: 2e-08

  losses: {
    "student-teacher": {
        enabled: True,
        type: LossLeJEPA,
        weight: 1.0,
        loss_fcts: {
          "JEPA": {
            'weight': 1,
            "loss_extra_args": {"temporal": true},
            "out_dim": 2048,
            "head": mlp,
            "num_layers": 2,
            "hidden_factor": 2,
            "sigreg_weight": 0.02,
            "sigreg_num_projections": 256,
            target_source_correspondence: {0: {0: "independent"} },
          },
        },
        target_and_aux_calc: "SelfTeacher",
      }
  }

  # No spatial masking — all cells visible for both views.
  # The prediction task is purely temporal (student at t, target at t+1).
  model_input: {
    "forecasting": {
      masking_strategy: "forecast",
      num_samples: 1,
      num_steps_input: 1,
      masking_strategy_config: {
        diffusion_rn: True,
        rate: 0.0,
        rate_sampling: False,
      },
    },
  }

  target_input: {
    "forecasting_target": {
      masking_strategy: "forecast",
      num_samples: 1,
      masking_strategy_config: { rate: 0.0, hl_mask: 0, rate_sampling: False },
    },
  }

  forecast:
    time_step: 00:00:00
    num_steps: 0
    policy: null

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled: False

  output: {
    num_samples: 0,
    normalized_samples: False,
    streams: null,
  }

  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: null
  grid: null
