# Muon overlay for config_gjl6a0kb_reproduction.yml.
# Muon updates all two-dimensional model weights; AdamW retains the baseline
# schedule for embeddings, normalisation parameters, biases, and other non-2D
# tensors. Keep this overlay after the baseline config when merging.
training_config:
  optimizer:
    name: muon
    muon:
      # At eight DDP ranks, sqrt scaling yields 1.41e-2 before Muon's
      # shape adjustment, a conservative point in the usual 1e-2--2e-2 range.
      lr_max: 5e-3
      momentum: 0.95
      nesterov: true
      ns_steps: 5
      eps: 1e-7
      adjust_lr_fn: original