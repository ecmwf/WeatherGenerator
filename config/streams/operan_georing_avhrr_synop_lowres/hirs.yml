HIRS :
  type : obs
  stream_id : 50
  filenames : ['observations-file-1978-2022-eumetsat-fdr-hirs-h512-v1.zarr']
  # geoinfo_channels : ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
  loss_weight : 1.0
  # masking_override :
  #   model_input :
  #     masking_strategy_config :
  #       rate: 1.0
  token_size : 512 # 256
  forcing: True
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 2
    dim_embed : 256
    num_blocks : 2
  embed_target_coords : 
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head : 
    ens_size : 1
    num_layers : 1

