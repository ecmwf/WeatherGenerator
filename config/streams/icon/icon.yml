ICON :
  type : anemoi
  filenames : ['/e/data1/slmet/ml_training/mch-realch1-fdb-1km-2005-2025-1h-pl13-ifsnames-v2.0.zarr']
  # filenames : ['/e/scratch/weatherai/rradev/mch-realch1-fdb-1km-2005-2025-1h-pl13-ifsnames-v2.0.zarr']
  frequency : 1h
  stream_id : 0
  source_exclude : ['tp_6h', 'tp', 'CAPE_ML', 'CAPE_MU', 'CIN_ML', 'CIN_MU', 'hcc', 'lcc', 'mcc', 'tcc', 'w_50', 'w_100', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_500', 'w_600', 'w_700', 'w_850', 'w_925', 'w_1000', 'LPI', 'PLCOV', 'ssrd', 'ssrd_6hr', 'strd', 'strd_6h', 'SKC', 'skt']
  # source : ['q_850', '10u']
  geoinfo_channels : ['cos_latitude', 'cos_longitude', 'sin_latitude', 
                      'sin_longitude', 'cos_julian_day', 'sin_julian_day',
                      'cos_local_time', 'sin_local_time','isor', 'sdor', 'SOILTYP']
  target : ['q_850', '10u']
  loss_weight : 1.
  #location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 1024
  tokenize_spacetime : True
  max_num_targets: 573990 # -1 # 
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 1024
  target_readout :
    num_layers : 4
    num_heads : 4
    # sampling_rate : 0.5
  pred_head :
    ens_size : 1
    num_layers : 1