# ERA5 variables with correlation length → hl_mask=4 at multiplier=1.0
# Finest-scale fields: precipitation (tp, cp), q_700, and some
# vertical velocity levels.
# L_corr range: ~160-250 km → target scale = L_corr

ERA5_fine :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id : 3
  source : ['tp', 'q_700']
  target : ['tp', 'q_700']
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets : -1
  masking_override :
    target_input :
      masking_strategy_config :
        hl_mask : 4
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
