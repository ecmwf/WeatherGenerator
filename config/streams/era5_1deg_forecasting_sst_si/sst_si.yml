ERA5SST :
  type : anemoi
  filenames : ['ERA5-1deg-6h-mean-forcing-1978-2024.zarr']
  stream_id : 1
  source_exclude : ['land_sea_mask']
  target_exclude : ['land_sea_mask']
  forcing: True
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets: 20000
  frequency : 06:00:00
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
    # sampling_rate : 0.2
  pred_head :
    ens_size : 1
    num_layers : 1
