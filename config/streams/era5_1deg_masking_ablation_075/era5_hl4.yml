# ERA5 variables with correlation length → hl_mask=4 at multiplier=0.75
# Fine-scale fields: precipitation, lower-level moisture, v_50, v_500,
# and most vertical velocity.
# L_corr range: ~160-500 km × 0.75 → target scale 120-375 km

ERA5_fine :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id : 3
  source : ['tp',
            'q_150', 'q_200', 'q_250', 'q_400', 'q_500', 'q_600', 'q_700', 'q_850',
            'v_50', 'v_500',
            ]
  target : ['tp',
            'q_150', 'q_200', 'q_250', 'q_400', 'q_500', 'q_600', 'q_700', 'q_850',
            'v_50', 'v_500',
            ]
  # 'w_50' matches w_500 (hl3), 'w_100' matches w_1000 (hl3)
  source_exclude : ['w_500', 'w_1000']
  target_exclude : ['w_500', 'w_1000']
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets : -1
  masking_override :
    target_input :
      masking_strategy_config :
        hl_mask : 4
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
