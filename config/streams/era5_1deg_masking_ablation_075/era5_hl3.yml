# ERA5 variables with correlation length → hl_mask=3 at multiplier=0.75
# Synoptic fields: surface winds, many zonal/meridional winds, some moisture,
# some vertical velocity, surface geopotential (z), tcw.
# L_corr range: ~500-1000 km × 0.75 → target scale 375-750 km

ERA5_synoptic :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id : 2
  source : ['10u', '10v',
            'q_300', 'q_925',
            't_150',
            'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'u_1000',
            'v_100', 'v_200', 'v_250', 'v_300', 'v_400', 'v_600', 'v_700', 'v_850', 'v_925', 'v_1000',
            
            'z']
  target : ['10u', '10v',
            'q_300', 'q_925',
            't_150',
            'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'u_1000',
            'v_100', 'v_200', 'v_250', 'v_300', 'v_400', 'v_600', 'v_700', 'v_850', 'v_925', 'v_1000',
           
            'z']
  # 'z' matches all z_* — exclude them to keep only surface geopotential
  # 'v_100' matches v_1000 — both are in this group, so no conflict
  source_exclude : ['z_']
  target_exclude : ['z_']
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets : -1
  masking_override :
    target_input :
      masking_strategy_config :
        hl_mask : 3
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
