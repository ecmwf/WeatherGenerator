# ERA5 stream config with per-variable channel masking for ALL variables.
# Autocorrelation values computed from the ERA5 O96 dataset using
# scripts/compute_autocorr.py (88 variables, 50 time samples, seed=42).
#
# Variables are grouped by recommended HEALPix masking level (with multiplier=1.5):
#   Level 1 (coarsest): z_*, t_*, q_*, sp, msl, cp, tcw, u_50, u_100, u_150, ...
#   Level 2:            10u, 10v, u_200-u_300, u_925, u_1000, v_50, v_100, v_150,
#                        v_1000, w_100, w_150, w_200, w_600, w_700
#   Level 3:            2t, skt, v_200-v_925, w_250, w_300, w_500, w_1000
#   Level 4:            w_400

ERA5 :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id : 0
  source_exclude : ['w_', 'skt', 'tcw', 'cp', 'tp']
  target_exclude : ['w_', 'slor', 'sdor', 'tcw', 'cp', 'tp']
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets: -1

  # Per-variable masking configuration based on autocorrelation.
  # Computed from ERA5 O96 with scripts/compute_autocorr.py:
  #   python compute_autocorr.py \
  #     --dataset .../aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr \
  #     --output config/autocorr_era5_o96_all.yml \
  #     --n-time-samples 50 --correlation-multiplier 1.5
  channel_masking:
    enabled: true
    autocorr:
      # ---- Geopotential height (all level 1) ----
      z_50:   {space_km: 64560}
      z_100:  {space_km: 42460}
      z_150:  {space_km: 21650}
      z_200:  {space_km: 17240}
      z_250:  {space_km: 15490}
      z_300:  {space_km: 14690}
      z_400:  {space_km: 13910}
      z_500:  {space_km: 12980}
      z_600:  {space_km: 11500}
      z_700:  {space_km: 9410}
      z_850:  {space_km: 5330}
      z_925:  {space_km: 3300}
      z_1000: {space_km: 1990}

      # ---- Temperature (all level 1) ----
      t_50:   {space_km: 6420}
      t_100:  {space_km: 5660}
      t_150:  {space_km: 4740}
      t_200:  {space_km: 2380}
      t_250:  {space_km: 7820}
      t_300:  {space_km: 11810}
      t_400:  {space_km: 12390}
      t_500:  {space_km: 13380}
      t_600:  {space_km: 15070}
      t_700:  {space_km: 19900}
      t_850:  {space_km: 19330}
      t_925:  {space_km: 18460}
      t_1000: {space_km: 19240}

      # ---- Specific humidity (all level 1) ----
      q_50:   {space_km: 3480}
      q_100:  {space_km: 2180}
      q_150:  {space_km: 3430}
      q_200:  {space_km: 2800}
      q_250:  {space_km: 2320}
      q_300:  {space_km: 1970}
      q_400:  {space_km: 1760}
      q_500:  {space_km: 1880}
      q_600:  {space_km: 2220}
      q_700:  {space_km: 2710}
      q_850:  {space_km: 4110}
      q_925:  {space_km: 5930}
      q_1000: {space_km: 6470}

      # ---- Zonal wind (levels 1-2) ----
      u_50:   {space_km: 3280}    # level 1
      u_100:  {space_km: 1760}    # level 1
      u_150:  {space_km: 1210}    # level 1
      u_200:  {space_km: 1070}    # level 2
      u_250:  {space_km: 1030}    # level 2
      u_300:  {space_km: 1040}    # level 2
      u_400:  {space_km: 1110}    # level 1
      u_500:  {space_km: 1220}    # level 1
      u_600:  {space_km: 1280}    # level 1
      u_700:  {space_km: 1320}    # level 1
      u_850:  {space_km: 1190}    # level 1
      u_925:  {space_km: 1080}    # level 2
      u_1000: {space_km: 1070}    # level 2

      # ---- Meridional wind (levels 2-3) ----
      v_50:   {space_km: 900}     # level 2
      v_100:  {space_km: 790}     # level 2
      v_150:  {space_km: 620}     # level 2
      v_200:  {space_km: 510}     # level 3
      v_250:  {space_km: 490}     # level 3
      v_300:  {space_km: 500}     # level 3
      v_400:  {space_km: 520}     # level 3
      v_500:  {space_km: 530}     # level 3
      v_600:  {space_km: 530}     # level 3
      v_700:  {space_km: 520}     # level 3
      v_850:  {space_km: 530}     # level 3
      v_925:  {space_km: 540}     # level 3
      v_1000: {space_km: 590}     # level 2

      # ---- Surface / single-level ----
      10u:    {space_km: 1040}    # level 2
      10v:    {space_km: 620}     # level 2
      2t:     {space_km: 500}     # level 3
      2d:     {space_km: 122990}  # level 1
      sp:     {space_km: 8210}    # level 1
      msl:    {space_km: 1630}    # level 1
      skt:    {space_km: 500}     # level 3 (excluded from source)
      tcw:    {space_km: 4270}    # level 1 (excluded from source)
      tp:     {space_km: 1390}    # level 1 (excluded from source)
      cp:     {space_km: 1650}    # level 1 (excluded from source)

      # ---- Vertical velocity (levels 1-4, excluded from source/target) ----
      # Included here for completeness; these variables are in source_exclude
      w_50:   {space_km: 1860}    # level 1
      w_100:  {space_km: 710}     # level 2
      w_150:  {space_km: 900}     # level 2
      w_200:  {space_km: 630}     # level 2
      w_250:  {space_km: 470}     # level 3
      w_300:  {space_km: 450}     # level 3
      w_400:  {space_km: 260}     # level 4
      w_500:  {space_km: 310}     # level 3
      w_600:  {space_km: 590}     # level 2
      w_700:  {space_km: 900}     # level 2
      w_850:  {space_km: 9550}    # level 1
      w_925:  {space_km: 19830}   # level 1
      w_1000: {space_km: 500}     # level 3

    multiplier: 1.5       # L_mask = multiplier * L_corr
    hl_mask_min: 1        # Minimum HEALPix level
    hl_mask_max: 5        # Maximum HEALPix level
    default_hl_mask: 3    # Default for variables not listed above

  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    type : 'obs_value'
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
