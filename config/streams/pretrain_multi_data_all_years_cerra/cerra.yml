# CERRA as a *diagnostic* output stream: it contributes no input tokens, so the
# frozen pretrained encoder sees exactly the same inputs as during pretraining.
# Only the CERRA decoder head is trained, with the CRPS (kernel_crps) loss.
# The CRPS ensemble is produced by latent perturbation (latent_perturbation_num_members
# in the top-level config), NOT by pred_head.ens_size, which stays 1.
CERRA :
  type : anemoi
  diagnostic : True
  filenames : ['cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr']
  frequency : 6h
  stream_id : 1
  source_exclude : ['skt','tciwv','tp','al','rsn','sde','sf']
  target_exclude : ['tciwv','tp','al','rsn','sde','sf']
  geoinfo_channels : ['orog', 'lsm']
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 64
  tokenize_spacetime : True
  # ASSUMPTION: cap target points per sample to bound memory. CRPS multiplies the
  # decoder cost by latent_perturbation_num_members, so this is set conservatively
  # below the era5_cerra value (570000). Raise/lower depending on observed memory.
  max_num_targets: 228000
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
