# ERA5 variables with correlation length → hl_mask=4 at multiplier=0.5
# Fine-scale fields: most winds, lower-level moisture, some mid-level
# temperature, and 10m winds.
# L_corr range: ~500-1050 km × 0.5 → target scale 250-525 km

ERA5_fine :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  stream_id : 2
  source : ['10u', '10v',
            't_150',
            'q_150', 'q_200', 'q_250', 'q_400', 'q_500', 'q_600', 'q_850', 'q_925',
            'u_200', 'u_250', 'u_300', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'u_1000',
            'v_50', 'v_100', 'v_300', 'v_500', 'v_600', 'v_700', 'v_850', 'v_925', 'v_1000',
            ]
  target : ['10u', '10v',
            't_150',
            'q_150', 'q_200', 'q_250', 'q_400', 'q_500', 'q_600', 'q_850', 'q_925',
            'u_200', 'u_250', 'u_300', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'u_1000',
            'v_50', 'v_100', 'v_300', 'v_500', 'v_600', 'v_700', 'v_850', 'v_925', 'v_1000',
            ]
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets : -1
  masking_override :
    target_input :
      masking_strategy_config :
        hl_mask : 4
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1
