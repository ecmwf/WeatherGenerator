# Geostationary observation streams for temporal JEPA.
# These mirror era5_georing_avhrr_forecast_random_inputs/geos.yml, with forcing
# removed so teacher masks are available to the SSL loss.

METEOSAT_SEVIRI_IR:
  type: obs
  stream_id: 10
  filenames: ['/ec/res4/scratch/ecm8347/real-time-data-download/processed/snapshots/20260805T1100Z/METEOSAT_SEVIRI_IR.zarr']
  geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'zenith', 'cos_sza', 'noise_time']
  forcing: True
  loss_weight: 1.0
  token_size: 1024
  tokenize_spacetime: False
  max_num_targets: 262144
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 4
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 512
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1

