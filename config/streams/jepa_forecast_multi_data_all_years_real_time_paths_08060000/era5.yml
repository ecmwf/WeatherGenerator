# Global ERA5 decoder grid for real-time inference.
#
# The historical Anemoi store supplies the checkpoint-bound channel metadata,
# normalization statistics, grid, and static geoinfos. The offgrid reader then
# supplies this full grid at the requested real-time output dates with
# mean-valued synthetic targets. Those synthetic targets must never be used for
# forecast verification.

