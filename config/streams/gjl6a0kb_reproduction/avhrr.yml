# Updated AVHRR and IASI-PC streams from:
# https://github.com/clessig/weathergen-configs/tree/main/streams_preprint/era5_georing_avhrr_synop_lowres_linear
AVHRR:
  type: obs
  stream_id: 22
  filenames: ['observations-file-2001-2023-eumetsat-avhrr-o256-v4.zarr']
  geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
  coords_channels: ['latitude', 'longitude']
  loss_weight: 1.0
  token_size: 256
  embed: {net: transformer, num_tokens: 1, num_heads: 2, dim_embed: 256, num_blocks: 2}
  embed_target_coords: {net: linear, dim_embed: 256}
  target_readout: {num_layers: 2, num_heads: 4}
  pred_head: {ens_size: 1, num_layers: 1}

METOP_IASI_PC:
  type: obs
  stream_id: 21
  filenames: ['observations-od-ai-0001-2011-2023-iasi-pc-bufr-v1.zarr']
  geoinfo_channels: ['cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
  loss_weight: 1.0
  token_size: 256
  embed: {net: transformer, num_tokens: 1, num_heads: 2, dim_embed: 256, num_blocks: 2}
  embed_target_coords: {net: linear, dim_embed: 256}
  target_readout: {num_layers: 2, num_heads: 4}
  pred_head: {ens_size: 1, num_layers: 1}