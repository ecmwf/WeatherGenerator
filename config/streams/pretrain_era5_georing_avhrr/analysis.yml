# ERA5 input stream for temporal JEPA.
# This mirrors era5_georing_avhrr_forecast_random_inputs/era5.yml, but is not marked
# forcing so the teacher metadata mask remains populated for SSL targets.

ERA5_in:
  type: anemoi
  filenames: ['aifs-od-an-oper-0001-mars-o96-2016-2023-6h-v6.zarr']
  stream_id: 0
  source_exclude: ['z', 'w_10', 'w_50', 'w_100', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_500', 'w_600', 'w_700', 'w_850', 'w_925', 'w_1000', 'skt', 'tcw', 'cp', 'tp', 'q_50', 'q_100']
  target_exclude: ['z', 'w_10', 'w_50', 'w_100', 'w_150', 'w_200', 'w_250', 'w_300', 'w_400', 'w_500', 'w_600', 'w_700', 'w_850', 'w_925', 'w_1000', 'slor', 'sdor', 'tcw', 'cp', 'tp', 'q_50', 'q_100']
  geoinfo_channels: ['z', 'lsm', 'slor', 'sdor', 'insolation', 'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day', 'noise_time']
  loss_weight: 1.0
  location_weight: cosine_latitude
  masking_override:
    model_input:
      masking_strategy: random
      masking_strategy_config:
        rate: 0.05
  token_size: 8
  tokenize_spacetime: True
  max_num_targets: -1
  frequency: 06:00:00
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 8
    dim_embed: 512
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 256
  target_readout:
    num_layers: 2
    num_heads: 4
  pred_head:
    ens_size: 1
    num_layers: 1
