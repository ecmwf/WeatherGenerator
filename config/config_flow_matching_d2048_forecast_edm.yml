# EDM (variance-exploding diffusion) EXPRESSED IN THE FLOW-MATCHING FRAMEWORK, d2048, forecast.
# Same architecture as config_flow_matching_d2048_forecast.yml (and its diffusion source
# config_diffusion_d2048_forecast_concat_noskip.yml); this variant selects the ve path +
# denoiser parameterization so the flow engine reproduces DiffusionForecastEngine:
#   ve path         : alpha=1, beta=sigma (x = z + sigma*eps), path variable = sigma
#   denoiser pred   : network predicts x0=z; to_velocity gives (x-D)/sigma = EDM's ODE slope
#   preconditioner  : c_in=1/sqrt(sigma^2+sigma_data^2), emb input log(sigma)/4, and the ORIGINAL
#                     Karras c_skip/c_out (default; set fe_diffusion_model_no_skip_connection: True
#                     for c_skip=0,c_out=1, matching diffusion.py's current hardcoded setting)
#   schedule        : rho-spaced sigma with training-aligned bounds (== diffusion.py _run_ode)
#   loss weight     : lambda(sigma)=(sigma^2+sigma_d^2)/(sigma*sigma_d)^2 (train), 1.0 (val)
#   noise draw      : log_normal eta~N(0,1) at the source (masking default branch)
#
# It should therefore learn/sample as well as the diffusion engine on this config. Deltas vs
# config_flow_matching_d2048_forecast.yml (the condot/velocity flow config):
#   * fe_flow_path: condot -> ve ; fe_flow_prediction_type: velocity -> denoiser
#   * noise_distribution: uniform -> log_normal ; masking blocks back to {diffusion_rn: True}
#   * validation_noise_levels are absolute log-sigma (sigma=exp(v)), NOT t or eta
#   * edm_noise_time_scale exposed (default 1.0 = spec-faithful; see diffusion-branch A/B)
#   * sigma_min/max/data, rho, p_mean/std, sigma_min_quantile are ACTIVE (not inert) here

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
# TODO: switching to < 1 triggers triton-related issues.
# See https://github.com/ecmwf/WeatherGenerator/issues/1050
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning #  Main options PerceiverIOCoordConditioning or Linear
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

# number of steps offset applied to first target window; if set to zero and forecast_steps=0 then
# one is training an auto-encoder
fe_num_blocks: 12
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
# fe_diffusion_model builds the time-conditioned (DiT) backbone in ForecastingEngine and the
# forecast target/conditioning construction in model.py — shared by both engines.
# fe_flow_matching_model then wraps that backbone in FlowMatchingForecastEngine (checked first).
fe_diffusion_model: True
fe_flow_matching_model: True
fe_diffusion_model_conditioning: "forecast" # options: "date_time", "time", "forecast"
fe_diffusion_model_conditioning_type: "concatenate" # options: "cross_attn", "ada_ln", "additive", "concatenate"
fe_layer_norm_after_blocks: []  # Index starts at 0. Thus, [3] adds a LayerNorm after the fourth layer
fe_impute_latent_noise_std: 0.0  # 1e-4
# currently fixed to 1.0 (due to limitations with flex_attention and triton)
forecast_att_dense_rate: 1.0
with_step_conditioning: True # False

# --- EDM (variance-exploding) via the flow-matching framework ---
fe_flow_path: ve                  # alpha=1, beta=sigma; path variable = sigma (descending in sampling)
fe_flow_prediction_type: denoiser # network predicts x0=z (EDM); to_velocity => (x-D)/sigma
fe_flow_sampler: ode              # EDM probability-flow ODE (Euler + Heun), == diffusion._run_ode
fe_flow_num_ensemble_members: 1
# ve output preconditioning: default = original Karras c_skip/c_out (unit-variance effective target
# via lambda(sigma)). Uncomment for c_skip=0, c_out=1 (direct x0 prediction, == diffusion.py today):
# fe_diffusion_model_no_skip_connection: True
fm_num_steps: 50                  # inference ODE steps (diffusion.py's effective default was 10)
fm_sde_sigma: 0.0                 # ve+sde is untested; keep 0 -> pure ODE
fm_diag_skip_steps: 1             # omit the first step from the sampling-diagnostics plot
fm_t_eps: 1.0e-3                  # inert for ve (condot-only t clamp); kept for portability
fm_time_scale: 1000.0            # inert for ve (condot-only t scaling); ve uses edm_noise_time_scale
fm_c_in: 1.0                      # inert for ve (condot identity input scaling)

# EDM noise-embedding input scale on log(sigma)/4. Default 1.0 = spec-faithful (matches
# diffusion.py). See the diffusion-branch A/B (edm_noise_time_scale 1/100/1000) — flip to 100-1000
# once that lands; NOT checkpoint-compatible, only set for a fresh run.
edm_noise_time_scale: 1.0

# EDM draws sigma from a log-normal at the source: eta ~ N(0,1) (masking.py default branch),
# sigma = exp(eta*p_std + p_mean) in training.
noise_distribution: log_normal

frequency_embedding_dim: 256
embedding_dim: 512
# EDM parameters (ACTIVE for the ve path): noising sigma, preconditioner c_in, sampling schedule.
sigma_min: 0.002
sigma_max: 80
sigma_data: 1.0
rho: 7
p_mean: 1.5
p_std: 1.2
sigma_min_quantile: 0.05          # sampling sigma_min floor: exp(p_mean + z_q*p_std), q=0.05

healpix_level: 5

# Use 2D RoPE instead of traditional global positional encoding
rope_2D: True
mlp_type: swiglu
use_xsa: True

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0 # 1e-5
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True


#below for FE training only
freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*pred_heads.*|.*target_token_engines.*|.*embed_target_coords.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*embed_engine.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"
#below for DECODER training only
# freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*embed_engine.*|.*fe.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"
#below for FE and DECODER training
# freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*embed_engine.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"

load_chkpt: {'run_id': 'iy534ge3', 'epoch': -1}  # d2048 hl5 pre-training with z

norm_type: "LayerNorm"

#####################################

streams_directory: "./config/streams/era5_1deg_forecasting_d2048/"
streams: ???

# type of zarr_store
zarr_store: "zip" # "zarr" for LocalStore, "zip" for ZipStore

general:

  # mutable parameters
  istep: 0
  rank: ???
  world_size: ???

  multiprocessing_method: "fork"

  desc: ""
  run_id: ???
  run_history: []

# logging frequency in the training loop (in number of batches)
train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

# parameters for data loading
data_loading :

  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch : False
  memory_pinning: True


# config for training
training_config:

  training_mode: ["masking","student_teacher"]

  num_mini_epochs: 128
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T18:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling :
    lr_start: 1e-6 #5e-5
    lr_max: 1e-5 #1e-4
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 64
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw :
      # parameters are scaled by number of DDP workers
      beta1 : 0.975
      beta2 : 0.9875
      eps : 2e-08

  losses : {
    "physical": {
        type: LossPhysical,
        weight: 0.0,
        loss_fcts: {
          "mse": {},
        },
        target_and_aux_calc: "Physical",
    },
    # NB keep the "latent_diff" key: it is the loss-term name the pipeline expects.
    # z_pre_norm now holds a velocity/noise/score, NOT a clean latent — so keep the physical
    # weight at 0.0 (decoding a velocity field into physical space is meaningless).
    "latent_diff": {
        type: LossFlowMatching,
        weight: 1.0,
        target_and_aux_calc: FlowMatchingTargetEncoder,
        loss_fcts: { "mse": { }, },
        }
  }

  model_input: {
    "forecasting" : {
      # masking strategy: "random", "healpix", "forecast"
      masking_strategy: "forecast",
      masking_strategy_config: {diffusion_rn: True},  # log_normal eta at source (masking default)
      num_steps_input: 2,
      num_samples: 1,
      }
    }

  target_input: {
    "forecasting" : {
      masking_strategy: "forecast",
      masking_strategy_config: {diffusion_rn: True},  # log_normal eta at source (masking default)
      num_steps_input: 1,
      num_samples: 1,
      }
    }

  forecast :
      time_step: 06:00:00
      num_steps: 1
      offset: 0
      policy: "fixed"


# validation config; full validation config is merge of training and validation config
validation_config:

  # Fixed noise levels for validation, each a separate pass with independently logged metrics.
  # For the ve/EDM path these are **absolute log-sigma** (sigma = exp(v)) — same convention as the
  # diffusion engine (diffusion.py: `or not self.training` => sigma=exp(v) for fixed levels), NOT
  # eta and NOT t. So [1,2,3,4] -> sigma ~ [2.72, 7.39, 20.1, 54.6]. They surface in the logs with
  # the usual Decimal.normalize() suffix: 1.0 -> .eta1e0, 2.0 -> .eta2e0, ...
  validation_noise_levels: [1.0, 2.0, 3.0, 4.0]

  samples_per_mini_epoch: 256
  shuffle: True

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T18:00

  # whether to track the exponential moving average of weights for validation
  validate_with_ema:
    enabled : True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  # parameters for validation samples that are written to disk
  output : {
    num_samples: 0,
    normalized_samples: False,
    streams: null,
    }

  validate_before_training: False


# Tags for experiment tracking
wgtags:
  org: null
  issue: null
  exp: null
  grid: null
