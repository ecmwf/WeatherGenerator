# Forecast finetuning after temporal JEPA over operational analysis, SYNOP/surface observations,
# polar-orbiting observations, and geostationary observations. This keeps the pretraining
# architecture checkpoint-compatible, but switches training to physical forecast prediction.

embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1
mlp_type: swiglu
use_xsa: True

ae_local_dim_embed: 1024
ae_local_num_blocks: 4
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 2
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 8
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 1
num_register_tokens: 7

fe_num_blocks: 6
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: []
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: True

healpix_level: 5
rope_2D: True

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ".*encoder.*|.*latent_pre_norm.*|.*latent_heads.*"
load_chkpt: {}
norm_type: "LayerNorm"
qk_norm_type: "RMSNorm"
zarr_store: "zip"

streams_directory: "./config/streams/era5_georing_avhrr_temporal_jepa_forecast_finetune/"
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "fork"
  desc: "temporal_jepa_forecast_finetune_era5_synop"
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False
  collapse_monitoring:
    enabled: false
    compute_frequency: 100
    log_frequency: 100
    metrics:
      effective_rank:
        enabled: true
        tensor_source: "both"
        sample_size: 2048
        forecast_aggregation: "all"
      singular_values:
        enabled: true
        tensor_source: "both"
        sample_size: 2048
        forecast_aggregation: "all"
      dimension_variance:
        enabled: true
        tensor_source: "both"
        forecast_aggregation: "all"
      prototype_entropy:
        enabled: true
      ema_beta:
        enabled: true

data_loading:
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch: False
  memory_pinning: True

training_config:
  training_mode: ["masking"]
  teacher_time_offset: 0
  num_mini_epochs: 32
  samples_per_mini_epoch: 4096
  shuffle: True

  start_date: 2017-01-01T21:00
  end_date: 2021-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 5e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    adamw:
      beta1: 0.975
      beta2: 0.9875
      eps: 2e-08

  losses:
    physical:
      enabled: true
      type: LossPhysical
      weight: 1.0
      loss_fcts:
        mse:
          weight: 1.0
          target_source_correspondence:
            0:
              0: "independent"
      target_and_aux_calc: "Physical"
    student-teacher:
      enabled: false
      type: Disabled

  model_input:
    forecasting:
      masking_strategy: forecast
      num_samples: 1
      num_steps_input: 1
      masking_strategy_config:
        rate: 1.0
        rate_sampling: false

  target_input:
    target:
      masking_strategy: random
      num_samples: 1
      num_steps_input: 1
      masking_strategy_config:
        rate: 1.0
        rate_sampling: false

  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 3
    policy: "fixed"

validation_config:
  samples_per_mini_epoch: 256
  shuffle: False
  start_date: 2022-10-01T00:00
  end_date: 2022-12-31T00:00
  validate_with_ema:
    enabled: false
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3
  output:
    num_samples: 0
    normalized_samples: False
    streams: null
  validate_before_training: False

wgtags:
  org: null
  issue: null
  exp: temporal_jepa_fcst
  grid: georing_avhrr_synop
  downstream: era5_synop
  masking: random_inputs