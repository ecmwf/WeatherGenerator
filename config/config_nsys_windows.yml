# Overwrite config: several separate nsys reports from one run. Launch with
#   nsys profile --capture-range=cudaProfilerApi --capture-range-end=repeat:2 -o trace_%n ...
# (repeat:N = number of enabled windows). See src/weathergen/utils/nsys_windows.py.
profiling:
  enabled: True
  # nvtx ranges per training step and per phase of it (forward, loss, backward, ...)
  nvtx_annotate: True
  # nvtx ranges per module forward/backward: a breakdown by module, but tens of microseconds
  # of CPU time per module call, which slows down the captured steps
  # nvtx_module_ranges: True
  nsys_windows:
    enabled: True
    # data reading + preprocessing until the first model forward pass is done
    startup: True
    # `steady_steps` training steps after `warmup_steps` untraced steps
    steady: True
    warmup_steps: 2
    steady_steps: 4
    # end the run after the last window (skips validation/checkpointing); False to train on
    stop_after_capture: True
