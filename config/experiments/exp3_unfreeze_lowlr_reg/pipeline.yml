# EXP3 — unfreeze-lowlr-reg pipeline (targets H1 amplifier: full-model plasticity).
#
# Identical to config/jepa_multi_data_pipeline.yml except the final stage fully
# unfreezes the model at a sane decaying LR + stronger regularization.
#
# COST NOTE: stages 1-3 are byte-for-byte the baseline. If your launcher can seed
# a train-continue from the existing baseline `finetune-forecast` checkpoint
# (xi0mujc2-finetune-forecast), delete stages 1-3 and keep only the last stage.

nodes: 1
register: true
cleanup-scripts: yes
results-dir: shared
mini-epoch: -1

stages:
  - name: pretrain
    command: train
    base-config: ./config/config_jepa_multi_data_all_years.yml
    config: ./config/config_jepa_multi_data_all_years.yml
    options: []
    chain: 2
    nodes: 2

  - name: pretrain-ft
    command: train
    config: ./config/config_jepa_multi_data_all_years_ft.yml
    options: []
    chain: 2
    nodes: 2

  - name: finetune-forecast
    command: train-continue
    from: pretrain-ft
    config: ./config/config_jepa_multi_data_ft_forecast_all_years.yml
    chain: 4
    nodes: 2

  # Stage 4: full-unfreeze operational finetune at sane LR + stronger reg
  - name: finetune-forecast-unfreeze
    command: train-continue
    from: finetune-forecast
    config: ./config/experiments/exp3_unfreeze_lowlr_reg/ft_forecast_unfreeze_lowlr.yml
    chain: 3
    nodes: 2
