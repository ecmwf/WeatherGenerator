    #   ERA5_out = aifs-ea-an-... (ERA5 OUT, unchanged)
    # time_window_step stays 1h: the operan reader (DataReaderAnemoiOperan) uses the
    # stream's nominal_time_mapping (0->5, 6->11, 12->17, 18->23) to pick the latest
