    # 8-step rollout fine-tuning of u84eegh1, offset 0 (matching u84eegh1), 8 epochs.
    # Extends the lr sweep of bns3v14m (5e-5) / gqvuahew (7.5e-5), but NOTE those
    # used offset 1 and 16 epochs, so they are not a like-for-like lr comparison.
    # x17s8a5o :
    #   slurm_id : 0
    #   description: "8-step fine-tuning of u84eegh1, lr 1e-4 cosine, offset 0, 8 epochs"
    # srl1jj3x :
    #   slurm_id : 0
    #   description: "8-step fine-tuning of u84eegh1, lr 2.5e-5 cosine, offset 0, 8 epochs"

    # NOTE: these three are NOT one lr sweep - two separate experiments.
    #   n1y6kc1o / datp7u95 are lessig2's runs: 9-step rollout, 16 ep, CONSTANT lr,
    #     encoder trainable, adamw b1/b2 0.98125/0.9875 eps 2e-8. Cooldown completed
    #     but stopped ~step 8218 with no chkpt00015; chkpt00012 missing on both.
    #   srl1jj3x (+ x17s8a5o above) are ours: 8-step rollout, 8 ep, cosine decay,
    #     encoder frozen, adamw b1/b2 0.9953125/0.996875 eps 1e-8. Both COMPLETED.
    # They also report different lead counts (1-7 ours vs 1-8 theirs), so only
    # compare per-variable MSE over matched leads. Over leads 1-7 all four sit
    # within 1-3.5%; lr is not a meaningful lever across 2.5e-5..1e-4.
    n1y6kc1o :
      slurm_id : 0
      description: "9-step ft of u84eegh1 (preops, lessig2), lr 7.5e-5 const, 16 ep, enc trainable"
    datp7u95 :
      slurm_id : 0
      description: "9-step ft of u84eegh1 (preops, lessig2), lr 5e-5 const, 16 ep, enc trainable"
    srl1jj3x :
      slurm_id : 0
      description: "8-step ft of u84eegh1 (preops), lr 2.5e-5 cosine, 8 ep, enc frozen - COMPLETED" 

    # 8-step rollout runs on streams_preprint (era5_georing_avhrr_synop_lowres_linear),
