stages:
  - name: pretrain
    stage: train
    config_files:
      - config/config_forecasting.yml
    chain_jobs: 3
    nodes: 2
    slurm_args:
      - "--time=23:59:00"

  - name: finetune
    stage: train
    from_run_id: STAGE.pretrain   # optional; use STAGE.<name> to reference a previous stage's run_id
    config_files:
      - config/config_forecasting_finetuning.yml
    chain_jobs: 2
    nodes: 2
    slurm_args:
      - "--time=23:59:00"

  - name: inference
    stage: inference
    from_run_id: STAGE.finetune
    options:
      - training_config.forecast.num_steps=120 
      - test_config.output.num_samples=10 
      - test_config.start_date=202310010000 
      - test_config.end_date=202312300000 
      - test_config.samples_per_mini_epoch=128 
    chain_jobs: 2
    nodes: 1
    slurm_args:
      - "--time=23:59:00"