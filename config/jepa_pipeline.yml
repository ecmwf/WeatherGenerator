# Temporal-JEPA pretrain -> forecast-finetuning experiment pipeline for launch-slurm.py.
#
# Usage from WeatherGenerator/:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/jepa_pipeline.yml
#
# This launches three comparable branches:
#   - multi-dataset temporal JEPA -> forecast finetune ERA5 + SYNOP/surface targets
#   - multi-dataset temporal JEPA -> forecast finetune ERA5 only
#   - oper-analysis-only temporal JEPA -> forecast finetune ERA5 only
#
# The updated pipeline launcher uses a strict schema. Keep top-level keys limited to
# `parallelize` and `stages`; use CLI flags such as --results-dir, --register, --account,
# and --cleanup-scripts when launching.

parallelize: true

stages:
  - name: multipretrain
    stage: train
    config_files:
      - ./config/config_era5_georing_avhrr_temporal_jepa.yml
    chain_jobs: 3
    nodes: 2

  - name: multiptofst
    stage: train
    config_files:
      - ./config/config_era5_georing_avhrr_temporal_jepa_offset.yml
    chain_jobs: 3
    nodes: 2

  - name: operpretrain
    stage: train
    config_files:
      - ./config/config_era5_georing_avhrr_temporal_jepa.yml
      - ./config/config_oper_analysis_temporal_jepa.yml
    chain_jobs: 3
    nodes: 2

  - name: multifcst
    stage: train
    from_run_id: STAGE.multipretrain
    config_files:
      - ./config/config_era5_georing_avhrr_temporal_jepa_forecast_finetune.yml
    chain_jobs: 3
    nodes: 2

  - name: multifcstofst
    stage: train
    from_run_id: STAGE.multiptofst
    config_files:
      - ./config/config_era5_georing_avhrr_temporal_jepa_offset_forecast_finetune.yml
    chain_jobs: 3
    nodes: 2

  - name: multiera5
    stage: train
    from_run_id: STAGE.multipretrain
    config_files:
      - ./config/config_era5_georing_avhrr_temporal_jepa_forecast_finetune.yml
      - ./config/config_era5_georing_avhrr_temporal_jepa_forecast_finetune_era5_only.yml
    chain_jobs: 3
    nodes: 2

  - name: operfcst
    stage: train
    from_run_id: STAGE.operpretrain
    config_files:
      - ./config/config_era5_georing_avhrr_temporal_jepa_forecast_finetune.yml
      - ./config/config_oper_analysis_temporal_jepa_forecast_finetune.yml
    chain_jobs: 3
    nodes: 2

