# Long-rollout forecast fine-tuning (up to 10 days), applied on top of
# config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml (the nhv6tkln recipe).
# See src/weathergen/utils/rollout.py for the options.
#
# Each batch rolls out K steps (6h each), K drawn uniformly from [8, 40] and identical on all
# ranks. The first K - 8 steps run without gradient (pushforward); the last 8 get gradient and
# loss, so K = 8 is exactly the nhv6tkln objective.

# keep the forecast engine unsharded during the rollout (no all-gather per step)
fe_reshard_after_forward: false

training_config:
  forecast:
    time_step: 06:00:00
    num_steps: [8, 40]
    offset: 1
    policy: random
    pushforward: true
    # last steps with gradient (-1: all steps, i.e. full backpropagation through the rollout)
    rollout_grad_steps: 8
    # last steps that are decoded and scored (default: rollout_grad_steps)
    rollout_loss_steps: 8
    # checkpoint whole forecast steps, so memory grows only with the latent state per step
    checkpoint_steps: true

# validate on the same fixed 8-step rollout as nhv6tkln, so the validation loss is comparable
validation_config:
  forecast:
    time_step: 06:00:00
    num_steps: 8
    offset: 1
    policy: fixed
