fe_diffusion_model_conditioning: "forecast"
fe_diffusion_model_conditioning_type: "concatenate"
fe_layer_norm_after_blocks: [11]
fe_impute_latent_noise_std: 0.0
fe_impute_latent_diffusion_noise_std: 1e-3
forecast_att_dense_rate: 1.0
with_step_conditioning: True
frequency_embedding_dim: 256
embedding_dim: 512
noise_distribution: &noise_distribution "log_uniform"
sigma_min: &sigma_min 0.4
sigma_max: &sigma_max 50
sigma_data: 1.0
rho: 7
p_mean: 3.5
p_std: 1.2

healpix_level: 5

rope_2D: True
mlp_type: mlp
use_xsa: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: True
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-05
norm_eps: 1e-04

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*pred_heads.*|.*target_token_engines.*|.*embed_target_coords.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"

load_chkpt: {'run_id': 'skkbxfya', 'epoch': -1}

norm_type: "LayerNorm"

