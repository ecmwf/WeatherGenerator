num_class_tokens: 0
num_register_tokens: 0

diffusion: {noise_stream: ERA5}
fe_num_blocks: 12
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_diffusion_latent_dim: 2560
