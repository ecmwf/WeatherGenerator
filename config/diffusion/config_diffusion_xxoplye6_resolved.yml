training_config:
  training_mode: ["masking", "student_teacher"]

  num_mini_epochs: 64
  samples_per_mini_epoch: 16384
  shuffle: True

  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling :
    lr_start: 1e-6
    lr_max: 2e-4
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 64
    num_steps_cooldown: 32768
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "constant"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw :
      beta1 : 0.99
      beta2 : 0.999
      eps : 2e-08

  losses : {
    "latent_diff": {
        type: LossLatentDiffusion,
        weight: 1.0,
        target_and_aux_calc: DiffusionLatentTargetEncoder,
        loss_fcts: { "mse": { }, },
        }
  }

  model_input: {
    "forecasting" : {
      masking_strategy: "forecast",
      masking_strategy_config: {
        diffusion_rn: True,
        noise_distribution: *noise_distribution,
        sigma_min: *sigma_min,
        sigma_max: *sigma_max,
        },
      num_steps_input: 2,
      num_samples: 1,
      }
    }

  target_input: {
    "forecasting" : {
      masking_strategy: "forecast",
      masking_strategy_config: {
        diffusion_rn: True,
        noise_distribution: *noise_distribution,
        sigma_min: *sigma_min,
        sigma_max: *sigma_max,
        },
      num_steps_input: 1,
      num_samples: 1,
      }
    }

  forecast :
      time_step: 06:00:00
      num_steps: 1
      offset: 0
      policy: "fixed"


