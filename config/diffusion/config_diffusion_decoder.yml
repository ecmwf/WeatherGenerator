embed_orientation: "channels"
embed_unembed_mode: "block"
embed_dropout_rate: 0.1

ae_local_dim_embed: 2048
ae_local_num_blocks: 0
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: True

ae_local_num_queries: 1
ae_local_queries_per_cell: False
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: True
ae_adapter_with_residual: True
ae_adapter_dropout_rate: 0.1

ae_global_dim_embed: 2048
ae_global_num_blocks: 4
ae_global_num_heads: 32
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: True
# TODO: switching to < 1 triggers triton-related issues.
# See https://github.com/ecmwf/WeatherGenerator/issues/1050
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 2
ae_global_trailing_layer_norm: False

ae_aggregation_num_blocks: 0
ae_aggregation_num_heads: 32
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: True
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 2

decoder_type: PerceiverIOCoordConditioning #  Main options PerceiverIOCoordConditioning or Linear
pred_adapter_kv: False
pred_self_attention: True
pred_dyadic_dims: False
pred_mlp_adaln: True
num_class_tokens: 0
num_register_tokens: 0

# number of steps offset applied to first target window; if set to zero and forecast_steps=0 then
# one is training an auto-encoder
fe_num_blocks: 12
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_diffusion_model: True
fe_diffusion_latent_dim: 2048
fe_diffusion_predict_residual: False
fe_diffusion_classifier_free_guidance_prob: 0.0
fe_diffusion_soft_clamp_channels: []  # [1511, 1772, 1689, 209, 1400, 1944, 1520, 1213, 1402, 646]
fe_diffusion_model_conditioning: "forecast" # options: "date_time", "time", "forecast"
fe_diffusion_model_conditioning_type: "concatenate" # options: "cross_attn", "concatenate", ..., "spatial_ada_ln", "ada_ln"
fe_layer_norm_after_blocks: [11]  # Index starts at 0. Thus, [3] adds a LayerNorm after the fourth block
fe_impute_latent_noise_std: 0.0  # 1e-4
fe_impute_latent_diffusion_noise_std: 1e-3  # 1e-4
# currently fixed to 1.0 (due to limitations with flex_attention and triton)
forecast_att_dense_rate: 1.0
with_step_conditioning: True # False
# Diffusion related parameters
frequency_embedding_dim: 256
embedding_dim: 512
noise_distribution: &noise_distribution "log_uniform"  # "log_uniform" or "log_normal"
sigma_min: &sigma_min 0.1
sigma_max: &sigma_max 0.11
sigma_data: 1.0
rho: 7
p_mean: 3.5  # only required if noise_distribution is log_normal
p_std: 1.2  # only required if noise_distribution is log_normal


# --- Diffusion loss weighting across noise levels ---
# "edm"           : lambda(sigma) = (sigma^2 + sigma_data^2)/(sigma*sigma_data)^2.
#                   Use WITH EDM preconditioning (c_skip/c_out enabled in diffusion.denoise).
# "min_snr_gamma" : min(SNR, gamma)/sigma_data^2 with SNR=sigma_data^2/sigma^2.
#                   For direct x0-prediction (no EDM preconditioning); caps the weight of
#                   trivial low-noise samples so training is not dominated by them.
# "uniform_x0"    : 1/sigma_data^2 constant weight for direct x0-prediction.
diffusion_loss_weighting: "edm"
diffusion_min_snr_gamma: 5.0
# Enable EDM preconditioning (c_skip/c_out, EDM Eq. 7) in the diffusion denoiser. When False
# the network predicts x0 directly (c_skip=0, c_out=1). Pair True with diffusion_loss_weighting
# "edm"; pair False with "min_snr_gamma"/"uniform_x0".
fe_diffusion_edm_preconditioning: False
# Quantile of the training noise distribution used to set the inference schedule's lower
# sigma bound; smaller -> refine down to lower noise.
sigma_min_quantile: 0.05
# Number of ODE denoising steps at inference. If null, uses diffusion.forward's default.
fe_diffusion_num_inference_steps: null

# --- Particle guidance (diverse ensemble sampling) ---
# Denoise the ensemble members jointly with a repulsive force between them instead of
# independently (Corso et al. 2024, repulsion-only / "fixed potential" variant). The RBF
# kernel acts per HEALPix cell, so the spread it creates is local. Only has an effect when
# fe_diffusion_num_ensemble_members > 1; with it False the sampler is the plain EDM ODE.
diffusion_particle_guidance: False
# Repulsion magnitude as a fraction of the ODE drift at sigma_max, annealed by the schedule
# below. 0.1 perturbs each step by ~10%; raise it until the member spread in the sampling
# diagnostics plot moves, and stop before per-member forecast skill degrades.
diffusion_particle_guidance_strength: 0.1
# Exponent p in alpha(sigma) = strength * (sigma / sigma_max_eff) ** p. Repulsion is
# strongest at high sigma, where the trajectory still decides which mode it falls into,
# and anneals to zero so that members finish on-manifold.
diffusion_particle_guidance_sigma_power: 1.0
# Space in which pairwise member distances are measured: "x0" (denoiser output; distances
# reflect differences in the predicted forecast) or "xt" (the noisy state, where at high
# sigma the distances are dominated by the independent noise draws).
diffusion_particle_guidance_kernel_space: "x0"
# Time constant tau, in forecast steps, of an exponential fade exp(-fstep / tau) applied to
# the strength across the rollout; 0 disables it. Worth setting: members share identical
# conditioning only at the first forecast step, which is where the repulsion does real work
# (picking different modes from the same information). Later steps start from per-member
# conditioning that has already diverged, so more repulsion double-counts spread the
# dynamics already produce -- and it compounds, k steps of a (1+eps) inflation giving
# (1+eps)^k. Under the fade the total stays ~exp(eps*tau) regardless of rollout length.
# tau of 2-4 is a sensible starting range. Measured from the rollout's first generated
# step, so forecast.offset > 0 still starts at full strength.
diffusion_particle_guidance_fstep_decay: 0.0
# HEALPix cells per batch when computing the repulsion; 0 = all at once. Memory/speed
# trade-off only -- the cells are independent, so the result is identical either way.
diffusion_particle_guidance_cell_chunk: 4096

# --- Conditioning noise (per-member perturbation of the latent conditioning) ---
# Inference-only: before denoising, each ensemble member's copy of the latent conditioning
# tokens gets its own Gaussian perturbation, so the members forecast from slightly
# different starting states instead of from identical information -- the
# ensemble-of-initial-conditions idea applied in latent space. Complementary to particle
# guidance: that pushes members apart inside one denoising pass, this hands them different
# information to begin with, and the model's own dynamics amplify it over the rollout.
# Amplitude as a fraction of the token norm (see the scope knob below), so 0.01 perturbs
# each conditioning token by ~1% of its own magnitude. 0.0 disables it entirely, leaving
# the conditioning and the RNG stream untouched. Start around 0.005-0.02 and raise it until
# the ensemble spread moves, stopping before per-member forecast skill degrades. Applies to
# single-sample inference too, so independent jobs differ from one another when the ensemble
# is assembled from separate runs rather than from one batched pass.
diffusion_conditioning_noise_std: 0.0
# Time constant tau, in forecast steps, of an exponential fade exp(-fstep / tau) on the
# amplitude across the rollout; 0 keeps it constant. Same reasoning as the particle
# guidance fade: the conditioning is identical across members only at the first forecast
# step, which is where the perturbation buys spread that is not already there. Later steps
# start from conditioning that has diverged on its own, and re-injecting a fixed relative
# perturbation every step compounds as (1+eps)^k. Measured from the rollout's first
# generated step, so forecast.offset > 0 still starts at full amplitude.
diffusion_conditioning_noise_fstep_decay: 0.0
# Which norm the amplitude is relative to: "token" (each HEALPix token's own RMS, so the
# perturbation follows the local token magnitude and stays proportional across the map) or
# "member" (one RMS per member, i.e. a spatially uniform absolute amplitude, which
# perturbs low-magnitude tokens relatively more).
diffusion_conditioning_noise_norm_scope: "token"
# How the perturbation is applied along the denoising trajectory:
#   "fixed" One draw per forecast step, added to the conditioning and held constant through
#           the whole ODE, so the member keeps a persistent perturbed state to forecast
#           from -- the latent analogue of an ensemble of initial conditions.
#   "cads"  CADS (Sadat et al., ICLR 2024, arXiv:2310.17347). The conditioning is
#           re-corrupted at every denoising step as sqrt(gamma)*c + s*sqrt(1-gamma)*noise,
#           with gamma rising from 0 to 1 along the trajectory: destroyed at high sigma,
#           where the trajectory decides which mode it falls into and diversity is won, and
#           fully restored by the end, where condition alignment is what matters. The member
#           is therefore left with an unbiased conditioning.
# Note the two read the scale s differently: under "fixed" it is the persistent relative
# perturbation the member carries, under "cads" (with rescaling) only a noise-to-signal
# ratio inside the ramp, so the same s is the more aggressive setting under "fixed".
# The tau1/tau2/psi knobs below apply to "cads" only.
diffusion_conditioning_noise_schedule: "fixed"
# CADS gamma(t) thresholds on trajectory progress t (1.0 at the first denoising step, 0.0 at
# the last): conditioning is clean for t <= tau1, fully destroyed for t >= tau2, and mixed
# linearly in between, so the corruption covers the first (1 - tau1) of the denoising steps.
# Paper defaults are tau1=0.6, tau2=1.0, ablated as tau1=0.2 degrading quality and tau1=0.9
# barely helping diversity. tau2 < 1.0 keeps some conditioning at every step, which is the
# knob to reach for first if a forecast drifts away from its initial state.
diffusion_conditioning_noise_tau1: 0.6
diffusion_conditioning_noise_tau2: 1.0
# CADS rescaling mix psi: after corruption the conditioning is renormalised back to the
# clean per-member mean/std, and psi is how much of that renormalised version is used
# (1.0 = fully rescaled, the paper's recommendation; 0.0 = no rescaling). It prevents
# divergence at high noise scales at a small cost in diversity. With psi > 0 the scale s
# above sets the noise-to-signal ratio inside the ramp rather than an absolute magnitude.
diffusion_conditioning_noise_rescale_psi: 1.0

healpix_level: 5

# Use 2D RoPE instead of traditional global positional encoding
# When True: uses 2D RoPE based on healpix cell coordinates (lat/lon)
# When False: uses traditional pe_global positional encoding
rope_2D: True
mlp_type: swiglu
use_xsa: True
# mlp_type: mlp
# use_xsa: False

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0 # 1e-5
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5 
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True


#below for FE training only
# freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*pred_heads.*|.*target_token_engines.*|.*embed_target_coords.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"
#below for DECODER training only
freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*noise_embedder.*|.*fe.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"
#below for FE and DECODER training
# freeze_modules: ".*latent_pre_norm.*|.*latent_heads.*|.*encoder.*|.*StreamEmbedder_ERA5.*|.*embed_engine.*|.*noise_embedder.*|.*ae_local_engine.*|.*ae_local_global_engine.*|.*ae_global_engine.*"

load_chkpt: {'run_id': 'drk4luv0', 'epoch': -1}  # ERA5+obs SSL diffusion forecast model

# Optionally overlay only the physical decoder (embed_target_coords / target_token_engines /
# pred_heads) from a separate run, on top of the primary checkpoint. Example:
#   load_decoder_chkpt: {'run_id': 'srdrwfy6', 'mini_epoch': -1}
load_decoder_chkpt: {}

norm_type: "LayerNorm"

#####################################

# streams_directory: "./config/streams/era5_1deg_forecasting_d2048/"
# streams_directory: "./config/streams/operan_georing_avhrr_synop_lowres/"
streams_directory: "./config/streams/era5_georing_avhrr_synop_lowres/"
streams: ???

# type of zarr_store
zarr_store: "zip" # "zarr" for LocalStore, "zip" for ZipStore

general:

  # mutable parameters
  istep: 0
  rank: ???
  world_size: ???

  # local_rank, 
  # with_ddp,
  # data_path_*, 
  # model_path,
  # run_path, 
  # path_shared_
  
  multiprocessing_method: "fork"

  desc: ""
  run_id: ???
  run_history: []

# logging frequency in the training loop (in number of batches)
train_logging:
  terminal: 10
  metrics: 20
  checkpoint: 250
  log_grad_norms: False

# parameters for data loading
data_loading :

  num_workers: 10
  rng_seed: ???
  repeat_data_in_mini_epoch : False

  # pin GPU memory for faster transfer; it is possible that enabling memory_pinning with 
  # FSDP2 + DINOv2 can cause the job to hang and trigger a PyTorch timeout error.
  # If this happens, you can disable the flag, but performance will drop on GH200.
  memory_pinning: False


# config for training
training_config:
  
  # training_mode: "masking", "student_teacher", "latent_loss"
  training_mode: ["masking","student_teacher"] # ["student_teacher", "physical_loss"]  

  num_mini_epochs: 16
  samples_per_mini_epoch: 4096
  shuffle: True
 
  # start_date: 1979-01-01T00:00
  start_date: 2014-01-01T00:00  # 2014, 2000 or 1990 if overfitting too much
  end_date: 2022-12-31T18:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00
  
  learning_rate_scheduling :
    lr_start: 1e-6 #5e-5
    lr_max: 1e-5 #1e-4
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 64
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 1.0
    weight_decay: 0.1
    log_grad_norms: False
    adamw :
      # parameters are scaled by number of DDP workers
      beta1 : 0.975
      beta2 : 0.9875
      eps : 2e-08

  losses : {
    "physical": {
        type: LossPhysical,
        weight: 1.0,
        loss_fcts: {
          "mse": {},
        },  
        target_and_aux_calc: "Physical",
    },
  #   "latent_diff": {
  #       type: LossLatentDiffusion,
  #       weight: 1.0,
  #       target_and_aux_calc: DiffusionLatentTargetEncoder,
  #       loss_fcts: { "mse": { }, },
  #       }
  }
  
  model_input: {
    "forecasting" : {
      # masking strategy: "random", "healpix", "forecast"
      masking_strategy: "forecast",
      masking_strategy_config: {
        diffusion_rn: True,
        noise_distribution: *noise_distribution,
        sigma_min: *sigma_min,
        sigma_max: *sigma_max
        },
      num_steps_input: 2,
      num_samples: 1,
      }
    }

  target_input: {
    "forecasting" : {
      masking_strategy: "forecast",
      masking_strategy_config: {diffusion_rn: True},
      num_steps_input: 1,
      num_samples: 1,
      }
    }

  forecast :
      time_step: 06:00:00
      num_steps: 1
      offset: 0
      policy: "fixed"


# validation config; full validation config is merge of training and validation config
validation_config: 

  # Noise levels (eta values in standard normal space) at which to evaluate the
  # diffusion model during validation. During validation sigma = exp(eta) directly (log-sigma interpretation).
  # Each value produces a separate validation pass with independently logged metrics.
  validation_noise_levels: [1.0, 2.0, 3.0, 4.0]

  samples_per_mini_epoch: 256
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T18:00
  
  # whether to track the exponential moving average of weights for validation
  validate_with_ema: 
    enabled : True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 1e-3

  # parameters for validation samples that are written to disk
  output : {
    # number of samples that are written
    num_samples: 0,
    # write samples in normalized model space
    normalized_samples: False,
    # output streams to write; default all
    streams: null,
    }

  # run validation before training starts (mainly for model development)
  validate_before_training: False


# test config; full test config is merge of validation and test config
# test config is used by default when running inference

# Tags for experiment tracking
# These tags will be logged in MLFlow along with completed runs for train, eval, val
# The tags are free-form, with the following rules:
# - tags should be primitive types (strings, numbers, booleans). NO lists or dictionaries
# - tags should not duplicate existing config entries.
# - try to reuse existing tags where possible. MLFlow does not like having too many unique tags
# - do not use long strings in values (less than 20 characters is a good rule of thumb, we may enforce this in the future)
wgtags:
  # The name of the organization of the person running the experiment.
  # This may be autofilled in the future. Expected values are lowercase strings 
  # e.g. "ecmwf", "cmcc", "metnor", "jsc", "escience"
  org: null
  # The Github issue corresponding to this run (number such as 1234)
  # Github issues are the central point when running experiment and contain 
  # links to hedgedocs, code branches, pull requests etc.
  # It is recommended to associate a run with a Github issue.
  issue: null
  # The name of the experiment. This is a distinctive codename for the experiment campaign being run.
  # This is expected to be the primary tag for comparing experiments in MLFlow, along with the
  # issue number.
  # Expected values are lowercase strings with no spaces, just underscores:
  # Examples: "rollout_ablation_grid"  
  exp: null
  # *** Experiment-specific tags ***
  # All extra tags (including lists, dictionaries, etc.) are treated 
  # as strings by mlflow, so treat all extra tags as simple string key: value pairs.
  grid: null
