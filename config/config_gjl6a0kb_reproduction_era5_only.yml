fe_diffusion_model: False

embed_orientation: channels
embed_unembed_mode: block
embed_dropout_rate: 0.1
ae_local_dim_embed: 1024
ae_local_num_blocks: 4
ae_local_num_heads: 16
ae_local_dropout_rate: 0.1
ae_local_with_qk_lnorm: true
ae_local_num_queries: 1
ae_local_queries_per_cell: false
ae_adapter_num_heads: 16
ae_adapter_embed: 128
ae_adapter_with_qk_lnorm: true
ae_adapter_with_residual: true
ae_adapter_dropout_rate: 0.1
ae_global_dim_embed: 2048
ae_global_num_blocks: 5
ae_global_num_heads: 16
ae_global_dropout_rate: 0.1
ae_global_with_qk_lnorm: true
ae_global_att_dense_rate: 1.0
ae_global_block_factor: 64
ae_global_mlp_hidden_factor: 4
ae_global_trailing_layer_norm: true
ae_aggregation_num_blocks: 5
ae_aggregation_num_heads: 16
ae_aggregation_dropout_rate: 0.1
ae_aggregation_with_qk_lnorm: true
ae_aggregation_att_dense_rate: 1.0
ae_aggregation_block_factor: 64
ae_aggregation_mlp_hidden_factor: 4
decoder_type: PerceiverIOCoordConditioning
pred_adapter_kv: false
pred_self_attention: true
pred_dyadic_dims: false
pred_mlp_adaln: true
num_class_tokens: 0
num_register_tokens: 64
noise_pre_predictor_std: 0
fe_num_blocks: 6
fe_num_heads: 16
fe_dropout_rate: 0.1
fe_with_qk_lnorm: true
fe_layer_norm_after_blocks: [7]
fe_impute_latent_noise_std: 0.0
forecast_att_dense_rate: 1.0
with_step_conditioning: true
healpix_level: 5
rope_2D: true
mlp_type: swiglu
use_xsa: true
with_mixed_precision: true
with_flash_attention: true
compile_model: false
with_fsdp: false
ddp_find_unused_parameters: false
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4
latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: false
latent_noise_deterministic_latents: true
freeze_modules: ""
norm_type: LayerNorm
qk_norm_type: RMSNorm
zarr_store: zip
streams_directory: ./config/streams/gjl6a0kb_ablation_era5_only/
streams: ???
general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: fork
  run_id: ???
  run_history: []
train_logging:
  terminal: 100
  metrics: 20
  checkpoint: 500
  log_grad_norms: false
data_loading:
  num_workers: 12
  num_workers_validation: 4
  rng_seed: ???
training_config:
  training_mode: [student_teacher]
  teacher_time_offset: 1
  deep_ssl:
    enabled: true
    tap_after: [local2global, "global:0", "global:1"]
    fusion_hidden_factor: 4
    level_weights: [0.25, 0.25, 0.25, 0.25]
  context_loss:
    enabled: false
  # Intentionally longer than gjl6a0kb's original 32-mini-epoch training.
  num_mini_epochs: 96
  samples_per_mini_epoch: 8192
  shuffle: true
  start_date: 1979-01-01T00:00
  end_date: 2022-12-31T00:00
  time_window_step: 06:00:00
  time_window_len: 06:00:00
  window_offset_prediction: 0
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-4
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 512
    num_steps_cooldown: 1024
    policy_warmup: cosine
    policy_decay: constant
    policy_cooldown: linear
    parallel_scaling_policy: sqrt
  optimizer:
    grad_clip: 0.25
    weight_decay: 0.05
    adamw: {beta1: 0.9875, beta2: 0.994, eps: 2e-8}
  losses:
    physical: {enabled: false, type: Disabled}
    student-teacher:
      enabled: true
      type: LossLatentSSLStudentTeacher
      weight: 1.0
      loss_fcts:
        JEPA:
          weight: 1
          loss_extra_args: {temporal: true}
          out_dim: 2048
          head: transformer
          num_blocks: 6
          num_heads: 16
          with_qk_lnorm: true
          intermediate_dim: 1024
          dropout_rate: 0.1
          target_source_correspondence: {"0": {"0": independent}}
      target_and_aux_calc:
        EMATeacher:
          ema_ramp_up_ratio: null
          ema_halflife_in_thousands: 400000
          model_param_overrides:
            training_config:
              losses:
                student-teacher:
                  loss_fcts: {JEPA: {head: identity}}
  model_input:
    random_easy: {masking_strategy: forecast, num_samples: 1, num_steps_input: 1, masking_strategy_config: {}}
  target_input:
    random_easy_target: {masking_strategy: forecast, num_samples: 1, masking_strategy_config: {}}
  # Temporal JEPA uses the step-zero identity forecast path; do not inherit
  # the offset=1 default used by physical forecasting configurations.
  forecast: {time_step: 00:00:00, num_steps: 0, offset: 0, policy: null}
validation_config:
  samples_per_mini_epoch: 256
  shuffle: false
  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00
  validate_with_ema: {enabled: false, ema_ramp_up_ratio: 0.09, ema_halflife_in_thousands: 1e-3}
  output: {num_samples: 0, normalized_samples: false, streams: null}
  validate_before_training: false
wgtags: {org: null, issue: null, exp: null, grid: null}
