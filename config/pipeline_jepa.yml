# Test pipeline for YAML-driven multi-stage Slurm launcher
# Global defaults
nodes: 1
register: true
cleanup-scripts: yes
results-dir: shared
mini-epoch: -1

stages:
  - name: stage1
    command: train
    base-config: ./config/config_jepa_frozen_mtm_sweep_2drope.yml
    config: ./config/config_jepa_frozen_mtm_sweep_2drope.yml
    options:
      - train_logging.log_grad_norms=True
    chain: 1
    nodes: 1

  - name: stage2.1
    command: train-continue
    from: stage1
    config: ./config/config_jepa_finetuning.yml

  - name: stage2.2
    command: train-continue
    config: ./config/config_jepa_finetuning.yml
    options:
      - streams_directory="./config/streams/era5_synop_finetuning"
    from: stage1

  - name: inference.1
    command: inference
    from: stage2.1
    samples: 8

  - name: inference.2
    command: inference
    from: stage2.2
    samples: 8
