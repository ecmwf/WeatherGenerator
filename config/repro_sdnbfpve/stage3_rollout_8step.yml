# sdnbfpve reproduction, stage 3: 8-step rollout fine-tune, encoder frozen (original run nhv6tkln)
# Copied from config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml at commit 1298747f.
# Use: overlay on stage 2 checkpoint (train_continue). See README.md in this directory.
# Changes vs source: streams_directory points at the copies in ./streams/; launch-time overrides written in: fe_impute_latent_noise_std and streams_directory (were --options at launch).

# Eight-step continuation overlay for an existing N320 physical forecast run.
# `train_continue` uses the saved ci2t558k config as its base, so retain only
# rollout-specific overrides here.
general:
  # Start a new eight-step fine-tuning schedule rather than inherit completed
  # two-step progress.
  istep: 0

# Keep the pretrained encoder and ERA5 decoding stack fixed while training the
# forecast engine for the longer rollout objective.
freeze_modules: ".*global.*|.*local.*|.*adapter.*|.*q_cells.*|.*latent.*|.*ERA5.*|.*encoder.*"

data_loading:
  num_workers: 8
  # Avoid DataLoader shared-memory transport during distributed validation.
  num_workers_validation: 4

# Launch-time override (was 2e-5 in the source config): --options fe_impute_latent_noise_std=1e-5
fe_impute_latent_noise_std: 1e-5

# Launch-time override (not set in the source config, which would inherit stage 2's streams):
streams_directory: ./config/repro_sdnbfpve/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/

training_config:
  num_mini_epochs: 8
  learning_rate_scheduling:
    lr_max: 1e-4
    policy_decay: cosine
    parallel_scaling_policy: "const"
  optimizer:
    grad_clip: 1.0
    adamw :
      # parameters are scaled by number of DDP workers
      beta1 : 0.9953125 # 0.9875 # at B=8 beta1 =0.9
      beta2 : 0.996875 # 0.994 # at B=8 beta1 approx 0.95
      eps : 1e-08

  forecast: {time_step: 06:00:00, num_steps: 8, offset: 1, policy: fixed}
