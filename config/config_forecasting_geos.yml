# Forecasting overlay for default_config.yml; shared model settings remain inherited.
# Each named encoder inherits those settings and can override its own architecture.
# Encoder grids may differ; latent widths, query counts and auxiliary-token counts must match.
# Legacy configs without an encoders section are not migrated by this example.
encoders:
  goes:
    healpix_level: 5
    ae_global_num_blocks: 4

# Use the coarsest shared grid, or "encoder" for each stream's own encoder grid.
decoder_latent: common

streams_directory: "./config/streams/forecasting_geos/"

training_config:
  # GOES-16 ABI data covers 2017-2024; reserve 2023 for validation.
  start_date: 2018-01-01T00:00
  end_date: 2022-12-31T00:00
  time_window_step: 06:00:00
  time_window_len: 06:00:00
  model_input:
    forecasting:
      masking_strategy: forecast
  forecast:
    time_step: 06:00:00
    offset: 1
    num_steps: 3
    policy: fixed

validation_config:
  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00
