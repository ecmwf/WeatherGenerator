  image_format: png
  animation_format: mp4
  dpi_val: 300
  ERA5:
    use_datashader: false
    marker_size: 4
    scale_marker_size: true
evaluation:
  metrics: ["ssr", "rmse", "psd"]
  regions:
  - global
  summary_plots: true
  summary_dir: ./plots/testing_ssr/ #[INSERT DECODER (LIST) ID(S) HERE]
