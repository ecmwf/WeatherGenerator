default_streams:
  ERA5:
    channels: ['q_850', '2t']
    evaluation:
      sample: "all"
      forecast_step: "all"
    plotting:
      sample: "all"
      forecast_step: "all"
      plot_maps: false
      plot_animations: false
      plot_bias: false
      plot_target: false
      plot_histograms: false
      plot_ensemble: "members"

