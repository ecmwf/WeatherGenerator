# Configuration for climate-index evaluation (e.g. NAM, SAM), used by the
# `evaluation-indices` entry point (run_index_evaluation.py). Structurally
# mirrors config/evaluate/eval_config.yml's default_streams/run_ids shape,
# but each stream declares an `indices:` list instead of `metrics:`.

# max_workers: 36  # hard cap on parallel workers (index computation, I/O)

default_streams:
  ERA5pl:
    channels: ["z_50", "z_500", "z_850"]
    # required: check_availability(mode="evaluation") skips the stream without this.
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"
    indices:
      - nam:
          min_lat: 20.0             # domain: polar cap, |lat| >= 20 (hemisphere
                                     # defaults per index, override via `hemisphere:`)
          use_climatology: true     # anomaly vs climatology (day-of-year+hour
                                     # matched); falls back to this sample's own
                                     # forecast-lead-time mean if false or if no
                                     # climatology file is found for the stream.
                                     # Fallback values are NOT comparable across
                                     # samples (each has its own baseline).
          significance_level: 0.05  # p-value threshold for the spatial pattern
      - sam:
          min_lat: 20.0             # domain: polar cap, |lat| >= 20S
          use_climatology: true
          significance_level: 0.05

  # Example: a stream whose zarr stores monthly means instead of 6h timesteps
  # (same dims/coords shape, "forecast_step" just advances by one month per
  # entry rather than 6h). Index computation itself (EOF/SVD, significance
  # test) is agnostic to the actual time delta between forecast steps, so no
  # per-index change is needed; only climatology time-matching must switch
  # from day-of-year+hour to calendar-month.
  ERA5pl_monthly:
    channels: ["z_50", "z_500", "z_850"]
    # Explicit override so this stream's own monthly-mean climatology is
    # loaded instead of the (inferred) hourly one; see
    # WeatherGenReader.get_climatology_filename.
    climatology_path: "/path/to/era5_monthly_climatology.zarr"
    climatology_match: monthly  # "hourly" (default, day-of-year+hour) or
                                 # "monthly" (calendar-month only, exact
                                 # match); use "monthly" when forecast_step
                                 # is a monthly-mean value instead of a 6h
                                 # step, matched against a monthly (not
                                 # hourly/daily) climatology dataset.
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"
    indices:
      - nam:
          min_lat: 20.0
          use_climatology: true
          significance_level: 0.05

  # Example: Nino 3.4 (ENSO SST-anomaly index), conventionally a monthly-mean
  # index. Unlike NAM/SAM it is a simple area-weighted box mean (no EOF/SVD),
  # so it has no `significance_level`/`hemisphere` params; its domain is a
  # fixed equatorial-Pacific box, overridable via `lat_min`/`lat_max`/
  # `lon_min`/`lon_max`.
  SSTmonthly:
    channels: ["sst"]
    climatology_path: "/path/to/sst_monthly_climatology.zarr"
    climatology_match: monthly
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"
    indices:
      - nino34:
          use_climatology: true    # anomaly vs monthly climatology; falls
                                    # back to this sample's own
                                    # forecast-lead-time mean otherwise (not
                                    # comparable across samples).
          # lat_min: -5.0           # defaults shown; override to customize
          # lat_max: 5.0            # the box (e.g. Nino 3, Nino 4, ...).
          # lon_min: -170.0
          # lon_max: -120.0

run_ids:
  n5lpzqsm:
    label: "pretrained model n5lpzqsm"
    results_base_dir: "./results/n5lpzqsm/"
    # if "streams" is not specified, the default_streams above are used
