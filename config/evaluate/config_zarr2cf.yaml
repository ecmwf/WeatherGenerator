# This file controls the conversion from Zarr format to CF-compliant NetCDF files in weathergen.evaluate.zarr_nc.zarr_to_netcdf.
# It defines the mapping of variable and dimension names, their standard names, units, and level types.
variables:
  q:
    var: q
    long: specific_humidity_at_pressure_levels
    std: specific_humidity
    wg_unit: kg kg**-1
    std_unit: kg kg-1
    level_type: pl
  t:
    var: t
    long: temperature_at_pressure_levels
    std: air_temperature
    wg_unit: K
    std_unit: K
    level_type: pl
  u:
    var: u
    long: u_wind_at_pressure_levels
    std: x_wind
    wg_unit: m s**-1
    std_unit: m s-1
    level_type: pl
  v:
    var: v
    long: v_wind_at_pressure_levels
    std: y_wind
    wg_unit: m s**-1
    std_unit: m s-1
    level_type: pl
  z:
    var: z
    long: geopotential_at_pressure_levels
    std: geopotential
    wg_unit: m**2 s**-2
    std_unit: m2 s-2
    level_type: pl
    scale_factor: 1.0 #0.10197 #1/9.80665
  10u:
    var: u10
    long: u_wind_at_10m
    std: x_wind
    wg_unit: m s**-1
    std_unit: m s-1
    level_type: sfc
  10v:
    var: v10
    long: v_wind_at_10m
    std: y_wind
    wg_unit: m s**-1
    std_unit: m s-1
    level_type: sfc
  2d:
    var: d2m
    long: dew_point_temperature_at_screen_level
    std: dew_point_temperature
    wg_unit: K
    std_unit: K
    level_type: sfc
  2t:
    var: t2m
    long: temperature_at_screen_level
    std: air_temperature
    #near-surface (usually, 2 meter) : https://pcmdi.llnl.gov/mips/cmip3/variableList.html
    wg_unit: K
    std_unit: K
    level_type: sfc
  msl:
    var: msl
    long: mean_sea_level_pressure
    std: air_pressure_at_mean_sea_level
    wg_unit: Pa
    std_unit: Pa
    level_type: sfc
  skt:
    var: skt
    # The standard name for skin temperature is sea_surface_skin_temperature, which is defined as "The temperature of the very thin layer at the surface of the sea that is in contact with the atmosphere".
  # It is strongly recommended that a variable with this standard name should have a units_metadata attribute, with one of the values "on-scale" or "difference", whichever is appropriate for the data, because it is essential to know whether the temperature is on-scale (meaning relative to the origin of the scale indicated by the units) or refers to temperature differences (implying that the origin of the temperature scale is irrevelant)
    long: skin_temperature
    std: sea_surface_skin_temperature
    wg_unit: K
    std_unit: K
    level_type: sfc
  sp:
    var: sp
    long: surface_pressure
    std: surface_air_pressure
    wg_unit: Pa
    std_unit: Pa
    level_type: sfc
  tp:
    var: tp
    long: total_precipitation
    std: precipitation_amount
    wg_unit: m
    std_unit: m
    level_type: sfc
  cp:
    var: cp
    long: convective_precipitation
    std: convective_precipitation_amount
    wg_unit: m
    std_unit: m
    level_type: sfc 
  tp_imerg_0:
    var: tp_imerg_0
    long: imerg_total_precipitation
    std: precipitation_amount
    wg_unit: m
    std_unit: m
    level_type: sfc
  hcc:
    var: hcc
    long: high_cloud_cover
    std: cloud_area_fraction_high
    wg_unit: 1
    std_unit: 1
    level_type: sfc
  mcc:
    var: mcc
    long: medium_cloud_cover
    std: cloud_area_fraction_medium
    wg_unit: 1
    std_unit: 1
    level_type: sfc
  lcc:
    var: lcc
    long: low_cloud_cover
    std: cloud_area_fraction_low
    wg_unit: 1
    std_unit: 1
    level_type: sfc
  tcc:
    var: tcc
    long: total_cloud_cover
    std: cloud_area_fraction
    wg_unit: 1
    std_unit: 1
    level_type: sfc
  strd:
    var: strd
    long: surface_thermal_radiation_downwards
    std: surface_downwelling_longwave_flux_in_air
    wg_unit: J m**-2
    std_unit: J m-2
    level_type: sfc
  ssrd:
    var: ssrd
    long: surface_solar_radiation_downwards
    std: surface_downwelling_shortwave_flux_in_air
    wg_unit: J m**-2
    std_unit: J m-2
    level_type: sfc

coordinates:
    sfc:
        valid_time: valid_time
        lat: latitude
        lon: longitude
        forecast_step: forecast_period
        forecast_reference_time: forecast_reference_time
        ncells: ncells
        mem: mem
    pl:
        pressure_level: pressure
        valid_time: valid_time
        lat: latitude
        lon: longitude
        forecast_step: forecast_period
        forecast_reference_time: forecast_reference_time
        ncells: ncells
        mem: mem

dimensions:
    valid_time:
      wg: valid_time
      std: time
    lat: 
      wg: latitude
      std: latitude
      std_unit: degrees_north
    lon: 
      wg: longitude
      std: longitude
      std_unit: degrees_east
    pressure_level:
      wg: pressure
      std: pressure
      std_unit: hPa
    forecast_reference_time: 
      wg: forecast_reference_time
      std: forecast_reference_time
    forecast_step:
      wg: forecast_period
      std: forecast_period
      long: time since forecast_reference_time
      std_unit: hours
    ncells:
      wg: ncells
      std: ncells
    mem:
      wg: mem
      std: realization
      long: realization
      std_unit: 1