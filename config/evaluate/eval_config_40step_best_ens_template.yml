max_workers: 12

evaluation:
  metrics: ["rmse", "crps", "spread", "ssr"]
  summary_plots: false
  ratio_plots: false
  heat_maps: false
  plot_score_maps: false
  plot_score_animations: false
  plot_score_timeseries: false
  print_summary: false
  score_cards: false
  bar_plots: false

default_streams:
  ERA5:
    regions: ["global"]
    channels: ["2t", "10u", "10v", "msl", "z_500", "t_850", "u_850", "v_850", "q_850", "z_250", "t_500", "u_250", "v_250"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"

run_ids:
  __RUN_ID__:
    label: "40-step score shard __RUN_ID__"
    results_base_dir: "./results/__RUN_ID__/"
    type: "anemoi-target"

