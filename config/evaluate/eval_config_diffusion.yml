evaluation:
  metrics  : ["rmse", "mae", "spread", "ssr","ssr_adj", "crps"] #spread + ssr are ensemble (probabilistic) metrics
  regions: ["global"]
  summary_plots : true
  ratio_plots : false
  heat_maps : false
  summary_dir: "./plots/"
  plot_ensemble: "members" #supported: false, "std", "minmax", "members"
  plot_score_maps: true #plot scores on a 2D maps (incl. ensemble spread map). it slows down score computation
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false
  num_processes: 0  #options: int, "auto", 0 means no parallelism (default)
  # baseline: "ar40mckx"


default_streams:
  ERA5:
    channels: ["2t", "q_850"] #, "10u", "10v", "z_500", "t_850", "u_850", "v_850", ]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all" #supported: "all", "mean", [0,1,2]
    plotting:
      sample: [0]  # inference wrote num_samples=1 -> only sample 0 exists; [1] silently yields no plots
      forecast_step: "all" #supported: "all", [1,2,3,...], "1-50" (equivalent of [1,2,3,...50])
      ensemble: [0] #supported: "all", "mean", [0,1,2]
      plot_maps: true
      plot_target: true
      plot_histograms: true
      plot_animations: true

      
