# max_workers: 36  # hard cap on parallel workers (I/O, plotting, scoring)

evaluation:
  # Real-time ERA5 targets are synthetic decoder-query placeholders until a
  # verifying analysis is available. Do not calculate skill metrics from them.
  metrics: []
  # regions: ["global", "nhem"] # Have regions here, if you want for them to apply to all streams (scores calculation)
  summary_plots : false
  ratio_plots : false
  heat_maps : false
  summary_dir: "./plots/"
  plot_ensemble: "members" #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false
  num_processes: 0  #options: int, "auto", 0 means no parallelism (default)
  # baseline: "ar40mckx"


default_streams:
  ERA5:
    regions: ["global"]
    channels: ["10ff", "2t", "10u", "10v", "z_500", "t_850", "u_850", "v_850", "q_300", "q_500", "q_700", "q_850", "q_1000"]
    # Enable this only after replacing the placeholder target with a matching
    # verifying analysis.
    evaluation: false
    plotting:
      sample: "all"
      forecast_step: "all" #supported: "all", [1,2,3,...], "1-50" (equivalent of [1,2,3,...50])
      ensemble: "all" #supported: "all", "mean", [0,1,2]
      plot_maps: true
      plot_bias: false
      plot_target: false
      plot_histograms: false
      plot_animations: true
      
