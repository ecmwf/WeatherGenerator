default_streams:
  ERA5_in:
    channels:
    - 2t
    - 10u
    - 10v
    - z_500
    - t_850
    - u_850
    - v_850
    - q_850
    evaluation:
      ensemble: all
      forecast_step: all
      sample: all
    plotting:
      forecast_step: all
      plot_animations: true
      plot_histograms: false
      plot_maps: true
      sample:
      - 1
evaluation:
  add_grid: true
  bar_plots: false
  heat_maps: false
  log_scale: false
  metrics:
  - rmse
  - froct
  plot_ensemble: members
  plot_score_maps: false
  print_summary: false
  ratio_plots: false
  regions:
  - global
  - tropics
  score_cards: false
  summary_dir: ./plots/
  summary_plots: true
