# Evaluation of the sdnbfpve 40-step inference array
# (scripts/inference_sdnbfpve_40step_array_safe.sbatch <prefix> -> runs <prefix>00000 ... <prefix>00015).
#
# Targets are read from the anemoi dataset (type: anemoi-target), not from the
# inference output. For the ERA5 stream (sdnbfpve's diagnostic output) that is
# aifs-ea-an-oper-0001-mars-n320-1979-2024-1h-v2-with-era51.zarr (ERA5 reanalysis).
#
# Before running:
#   1. merge the one-sample runs into <prefix>merge:
#        uv run python scripts/aggregate_inference_zarr.py <prefix>
#   2. below, replace <prefix> in "<prefix>merge:" with your prefix.
# Results and run configs are found through the private config (shared_work of the course).
#
# Run (CPU only, from the WeatherGenerator root):
#   uv run evaluate --config config/evaluate/eval_sdnbfpve_40step.yml

evaluation:
  metrics: ["rmse", "froct"]
  regions: ["global"]
  summary_plots: true
  ratio_plots: false
  heat_maps: false
  summary_dir: "./plots/sdnbfpve_40step/"
  plot_ensemble: "members"
  plot_score_maps: false
  print_summary: false
  log_scale: false
  add_grid: true
  score_cards: false
  bar_plots: false

default_streams:
  ERA5:
    channels: ["2t", "10u", "10v", "z_500", "t_850", "u_850", "v_850", "q_850"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"
    plotting:
      sample: [0]
      forecast_step: [1, 24, 72, 120, 240]  # hourly steps: 1 h, 1 d, 3 d, 5 d, 10 d
      plot_maps: true
      plot_target: true
      plot_histograms: false
      plot_animations: false

run_ids:
  <prefix>merge:
    label: "sdnbfpve, 40 steps (4 init times, 2023-06-03T12 to 2023-06-05T00)"
    type: anemoi-target
    mini_epoch: 0

  # Alternative without merging: score each one-sample run separately
  # (one curve per init time instead of one averaged curve). Uncomment, replace
  # <prefix>, and remove <prefix>merge above; repeat for <prefix>00002 ... <prefix>00015.
  # <prefix>00000:
  #   label: "sdnbfpve init 2023-06-03T12"
  #   type: anemoi-target
  #   mini_epoch: 0
  # <prefix>00001:
  #   label: "sdnbfpve init 2023-06-04T00"
  #   type: anemoi-target
  #   mini_epoch: 0
