evaluation:
  metrics  : ["rmse", "mae"]
  regions: ["global"]
  summary_plots : true
  ratio_plots : false
  heat_maps : false
  summary_dir: "./plots/"
  plot_ensemble: "members" #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false
  num_processes: 0  #options: int, "auto", 0 means no parallelism (default)
  # baseline: "ar40mckx"


default_streams:
  NPPATMS:
    channels: ["obsvalue_rawbt_1", "obsvalue_rawbt_2", "obsvalue_rawbt_3", "obsvalue_rawbt_4", "obsvalue_rawbt_5", "obsvalue_rawbt_6", "obsvalue_rawbt_10", "obsvalue_rawbt_20"]  #, "10v", "z_500", "t_850", "u_850", "v_850", "q_850", ]
    evaluation:
      forecast_step: "all"
      sample: [1, 2, 3, 4, 5, 6, 7]
      ensemble: "all" #supported: "all", "mean", [0,1,2]
    plotting:
      sample: [1, 2, 3, 4, 5, 6, 7]
      forecast_step: "all" #supported: "all", [1,2,3,...], "1-50" (equivalent of [1,2,3,...50])
      ensemble: "all" #supported: "all", "mean", [0,1,2]
      plot_maps: true
      plot_target: true
      plot_histograms: true
      plot_animations: false

run_ids :
  # diagnostic NPPATMS model, spm6zeor, continued training of pretrained model k8smwg67
  v9ntzbh2:
    label: "diagnostic NPPATMS model spm6zeor, cont. k8smwg67"
