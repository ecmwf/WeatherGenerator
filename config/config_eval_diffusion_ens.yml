evaluation:
  metrics: ["rmse"]
  regions: ["global"]
  summary_plots : true
  ratio_plots : false
  heat_maps : false
  summary_dir: "./plots/"
  plot_ensemble: false #single aggregate curve per model; no per-member/per-case traces
  plot_score_maps: false #not needed for the lead-time comparison; slows down scoring a lot
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: true
  score_cards: false
  bar_plots: false


default_streams:
  ERA5:
    climatology_path: "/e/scratch/weatherai/shared_work/assets/climatology/aifs-ea-an-oper-0001-mars-o96-1980-2020-6h-v6_climatology.zarr"
    # channels: ["2t", "10u", "10v", "z_500", "t_850", "u_850", "v_850", "q_850"]
    channels: ["2t", "t_850", "q_850"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all" #supported: "all", "mean", [0,1,2]
    plotting:
      sample: []
      forecast_step: "all" #supported: "all", [1,2,3,...], "1-50" (equivalent of [1,2,3,...50])
      plot_maps: false
      plot_histograms: false
      plot_animations: false

# Each dj*/zz* id below is one independent single-case rollout (one init date/time,
# confirmed from the zarr 'source_interval' attrs), not multiple samples. To get a
# robust RMSE-vs-lead-time curve we merge many per-case runs into one virtual run.
#
# type: "jsonmerge" reads each case's cached per-run score JSON (computed once by
# scripts/evaluate_diffusion_ens_percase_array.sbatch) instead of re-reading all the
# raw zarr stores every time - required, since reading 44-49 multi-hundred-GB zarr
# stores in one go blows through any reasonable Slurm time limit.
#
# The "mean of members" vs. "ensemble mean" distinction is decided by the ensemble
# setting used when each case was cached (NOT by this config): deterministic_mean
# and diffusion_member_mean read the standard per-case cache (evaluation.ensemble:
# "all"). diffusion_ensemble_mean needs the dj* cases re-cached with
# evaluation.ensemble: "mean" first (this overwrites the standard cache for those
# run_ids, so run/merge diffusion_member_mean before re-caching for ensemble_mean).

