evaluation:
  # metrics: ["rmse", "acc", "froct", "spread", "ssr", "ssr_adj", "crps"]
  # metrics: ["rmse", "acc", "froct"]
  # metrics: ["rmse"]
  metrics: ["rmse", "ssr"]
  # regions: ["global", "nhem"]
  regions: ["global"]
  summary_plots : true
  ratio_plots : false
  heat_maps : false
  summary_dir: "./plots/"
  plot_ensemble: "members" #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: true
  score_cards: false
  bar_plots: false


default_streams:
  ERA5:
    climatology_path: "/e/scratch/weatherai/shared_work/assets/climatology/aifs-ea-an-oper-0001-mars-o96-1980-2020-6h-v6_climatology.zarr"
    channels: ["2t", "10u", "10v", "z_500", "t_850", "u_850", "v_850", "q_850"]
    # channels: ["2t", "z_500", "q_850"]
    # channels: ["10u"]
    evaluation:
      forecast_step: "all"
      # forecast_step: [1, 2, 3, 4]
      # forecast_step: [1]
      sample: "all"
      # sample: "1-16"
      # sample: [0]
      ensemble: "all" #supported: "all", "mean", [0,1,2]
      # ensemble: "mean"
    plotting:
      sample: [0]
      forecast_step: "all" #supported: "all", [1,2,3,...], "1-50" (equivalent of [1,2,3,...50])
      # forecast_step: [0]
      # forecast_step: "0-2"
      plot_maps: true
      plot_histograms: false
      plot_animations: true
      # ensemble: "mean"  #supported: "all", "mean", [0,1,2]

