# Muon overlay for config_gjl_repro_finetune_forecast.yml.
# Use a smaller Muon peak during fully-unfrozen fine-tuning, while leaving the
# baseline AdamW fallback schedule and all data/model settings unchanged.
training_config:
  optimizer:
    name: muon
    muon:
      # At eight DDP ranks, sqrt scaling yields 7.07e-3 before Muon's
      # shape adjustment, preserving the pretrained encoder conservatively.
      lr_max: 2.5e-3
      momentum: 0.95
      nesterov: true
      ns_steps: 5
      eps: 1e-7
      adjust_lr_fn: original