# SMOKE TEST of decoder_only.yml: 1 node, 1 mini-epoch of 96 samples, 32 validation samples. Decoder-only fine-tune of crps8long: decoder_crps (long_rollout_2026-10-22/decoder_crps.yml) with the forecast
# engine's WEIGHTS FROZEN (freeze_weights_only=forecast_engine; it stays in train mode, so its dropout, the MC-dropout
# ensemble mechanism, is active in training). Only the ERA5 decoder trains, without decoder dropout. Everything else
# is decoder_crps's: from axhby5w8 mini-epoch 10, pushforward K 8..40, anchor 4 + final 4, 2 members, fair CRPS,
# lead balance 0.5, 4 mini-epochs at lr_max 1e-5.
# Question: decoder_crps gained ~4% z500 CRPS at day 1 (mostly by removing excess small-scale z500 member noise) but
# lost 1-2% at days 3-10 through a worse ensemble mean. Is that cost from the forecast engine co-adapting? Here the
# latent dynamics are exactly crps8long's, so any medium-range change comes from the decoder alone.
# chain_jobs 2: decoder-only steps are cheaper than decoder_crps's; avoids a redundant chain part re-saving chkpts.
# Launch from the WeatherGenerator root (smoke test first: decoder_only_smoke.yml):
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-11-16/decoder_only_smoke.yml
parallelize: true
stages:
  - name: smokedecoderonly
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
      - ./config/config_long_rollout_anchor.yml
      - ./config/config_long_rollout_crps.yml
      - ./config/config_lead_balance_xxlm80yw.yml
      - ./config/config_decoder_trainable.yml
    options:
      - load_chkpt.run_id=axhby5w8
      - load_chkpt.mini_epoch=10
      - pred_dropout_rate=0.0
      # freeze the forecast engine's weights but keep it in train mode: its dropout is the ensemble mechanism
      - freeze_weights_only=forecast_engine
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.forecast.lead_balance.power=0.5
      # 4 + 4 scored steps with gradient, as crps8long (8 + 8 do not fit with 2 members)
      - training_config.forecast.rollout_anchor_steps=4
      - training_config.forecast.rollout_grad_steps=4
      - training_config.forecast.rollout_loss_steps=4
      - training_config.forecast.num_steps=[8,12,16,20,24,28,32,36,40]
      - training_config.num_mini_epochs=1
      - training_config.samples_per_mini_epoch=96
      - validation_config.samples_per_mini_epoch=32
      - train_logging.terminal=4
      - training_config.learning_rate_scheduling.lr_max=1.0e-05
      - training_config.learning_rate_scheduling.num_steps_warmup=64
      - training_config.learning_rate_scheduling.num_steps_cooldown=128
      # write the _latest checkpoint within each 256-batch mini-epoch so chain parts can resume
      - train_logging.checkpoint=128
    chain_jobs: 1
    nodes: 1
    slurm_args: ["--time=01:00:00"]
