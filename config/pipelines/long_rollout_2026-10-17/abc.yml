# Long-rollout forecast training, runs A-C, all from nhv6tkln (8-step rollout fine-tune,
# mini-epoch 8) with its recipe: only the forecast engine trains (freeze_modules of
# config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml), lr_max 1e-4, fresh optimizer and
# schedule, validation as nhv6tkln (8 steps, EMA weights). Code: autocast-cache fix 2af40f93 and
# forecast policy random_choice.
#   A_ctrl8 : 8-step MSE, as nhv6tkln, 8 mini-epochs (65536 samples, ~10.6 h on 8 nodes as
#             measured for nhv6tkln)
#   B_pf    : pushforward, K uniform from [8, 16, 24, 32, 40] steps (every lead time 6h - 10 d
#             scored in 1/5 of the batches), gradient and loss on the last 8, MSE,
#             step checkpointing; 5 mini-epochs (40960 samples, ~9.5 h estimated)
#   C_pfcrps: B with fair kernel CRPS over 2 MC-dropout members (MSE logged with weight 0),
#             5 mini-epochs
# B and C get fewer samples for about the same compute (~85 node hours each). chain_jobs 2 only
# as a guard against the 12 h limit: a second part continues from the run's own checkpoint and
# exits after a few minutes if training is already complete.
# Launch from the WeatherGenerator root:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-10-17/abc.yml
parallelize: true
stages:
  - name: A_ctrl8
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
    options:
      - load_chkpt.run_id=nhv6tkln
      - load_chkpt.mini_epoch=8
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=8
    chain_jobs: 2
    nodes: 8

  - name: B_pf
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
    options:
      - load_chkpt.run_id=nhv6tkln
      - load_chkpt.mini_epoch=8
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=5
    chain_jobs: 2
    nodes: 8

  - name: C_pfcrps
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
      - ./config/config_long_rollout_crps.yml
    options:
      - load_chkpt.run_id=nhv6tkln
      - load_chkpt.mini_epoch=8
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=5
    chain_jobs: 2
    nodes: 8
