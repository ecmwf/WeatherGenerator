# Control for combo_det: B'' (seymbjh2 mini-epoch 5) continued with exactly combo_det's schedule
# (4 mini-epochs, re-warm to 1e-5 over 64 steps, cooldown 128) but WITHOUT its two changes: the
# z/msl x10 loss weights (streams stay B'''s ..._mnt_cw from the base config) and the trained
# decoder (decoder stays frozen, as in B''). combo_det minus control_det = effect of the changes;
# control_det minus B'' = effect of the extra training alone.
# Signal: val MSE at steps 1-8 vs combo_det (ch7py82d) and B'' final.
# Launch from the WeatherGenerator root:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-10-22/control_det.yml
parallelize: true
stages:
  - name: controldet
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
      - ./config/config_long_rollout_anchor.yml
      - ./config/config_fe_no_dropout.yml
      - ./config/config_lead_balance_xxlm80yw.yml
    options:
      - load_chkpt.run_id=seymbjh2
      - load_chkpt.mini_epoch=5
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=4
      - training_config.learning_rate_scheduling.lr_max=1.0e-05
      - training_config.learning_rate_scheduling.num_steps_warmup=64
      - training_config.learning_rate_scheduling.num_steps_cooldown=128
      # write the _latest checkpoint within each 256-batch mini-epoch so chain parts can resume
      - train_logging.checkpoint=128
    chain_jobs: 3
    nodes: 8
