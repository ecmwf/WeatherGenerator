# Clean ablation of the long-lead objective for the CRPS line: crps8long (axhby5w8) WITHOUT the
# long-rollout package. Same start (crps8 klbklwf7 mini-epoch 12), same fresh schedule (10
# mini-epochs, re-warm to lr_max 5e-5), same streams, latent noise and frozen decoder, but crps8's
# own objective: fixed 8-step rollout with fair CRPS on all 8 steps, no pushforward, no anchoring,
# no lead balancing. crps8long's 2-3% CRPS gain over crps8 at days 7-10 (from more spread, not
# better members) also had a learning-rate restart and 22 vs 25 mini-epochs; against this run the
# only difference is the long-rollout package.
# Signal: the 40-step ensemble eval vs crps8long (c8l4) and crps8 (c8f4).
# Launch from the WeatherGenerator root:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-10-24/crps8_restart.yml
parallelize: true
stages:
  - name: crps8restart
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_crps.yml
    options:
      - load_chkpt.run_id=klbklwf7
      - load_chkpt.mini_epoch=12
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=10
      - training_config.learning_rate_scheduling.lr_max=5.0e-05
      - training_config.forecast.checkpoint_steps=true
      # write the _latest checkpoint within each 256-batch mini-epoch so chain parts can resume
      - train_logging.checkpoint=128
    chain_jobs: 4
    nodes: 8
