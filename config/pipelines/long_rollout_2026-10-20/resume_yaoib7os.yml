# Resume A' (ctrl8nd, A without forecast-engine dropout): 7 mini-epochs left at ~1.7 h, in place (run_id == from_run_id) from its mini-epoch 0 checkpoint.
# Its chain broke: later chain parts load yaoib7os_latest.chkpt, which the trainer only writes every
# train_logging.checkpoint (500) batches within a mini-epoch, never reached with 256-batch
# mini-epochs; after the 2026-10-20 filesystem incident every further part failed at startup.
# train_logging.checkpoint=128 makes the _latest checkpoint exist for the parts of this resume.
# Launch from the WeatherGenerator root:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-10-20/resume_yaoib7os.yml
parallelize: true
stages:
  - name: ctrl8ndresume
    stage: train
    run_id: yaoib7os
    from_run_id: yaoib7os
    mini_epoch: 0
    options:
      - train_logging.checkpoint=128
    chain_jobs: 2
    nodes: 8
