# Smoke test of lead_cond.yml (same stage): 1 node, 24 steps, 32 validation samples.
# Launch from the WeatherGenerator root:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-10-20/lead_cond_smoke.yml
parallelize: true
stages:
  - name: smokepfanchcond
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
      - ./config/config_long_rollout_anchor.yml
      - ./config/config_fe_no_dropout.yml
      - ./config/config_fe_lead_time_cond.yml
    options:
      - load_chkpt.run_id=nhv6tkln
      - load_chkpt.mini_epoch=8
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=1
      - training_config.samples_per_mini_epoch=96
      - validation_config.samples_per_mini_epoch=32
      - train_logging.terminal=4
    chain_jobs: 1
    nodes: 1
    slurm_args: ["--time=01:00:00"]
