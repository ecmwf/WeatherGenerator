# 20-day pushforward horizon for the CRPS line: crps8long (crps8_long.yml) with rollouts K in
# [8, 12, ..., 80] (2-20 days) instead of [8, ..., 40], and an 80-step lead-balance table
# (config_lead_balance_c8lx80.yml: steps 1-40 as crps8long's table, 41-80 from crps8long's own
# 80-step member MSE growth). Everything else is crps8long's: klbklwf7 chkpt 12, anchor 4 + final 4
# with gradient, 2 members, kernel CRPS, lead balance power 0.5, 10 mini-epochs at lr_max 5e-5.
# 20-day evals: crps8long's CRPS gain over crps8_restart grows to day 20 (z500 0.955, 2t 0.882).
# Rollouts are ~1.8x longer on average than crps8long's, so chain_jobs 6 (crps8long needed 2 of 4).
# Launch from the WeatherGenerator root (smoke test first: crps20d_smoke.yml):
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-10-26/crps20d.yml
parallelize: true
stages:
  - name: crps20d
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
      - ./config/config_long_rollout_anchor.yml
      - ./config/config_long_rollout_crps.yml
      - ./config/config_lead_balance_c8lx80.yml
    options:
      - load_chkpt.run_id=klbklwf7
      - load_chkpt.mini_epoch=12
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.forecast.lead_balance.power=0.5
      # 4 + 4 scored steps with gradient (8 + 8 do not fit with 2 members: OOM at 90 GiB in the
      # smoke test ioq8yjj6), so the memory is that of crps8 and C
      - training_config.forecast.rollout_anchor_steps=4
      - training_config.forecast.rollout_grad_steps=4
      - training_config.forecast.rollout_loss_steps=4
      # K in steps of 4, so that the final windows of 4 steps tile 6h - 20 days (K = 8 is crps8's objective)
      - training_config.forecast.num_steps=[8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80]
      - training_config.num_mini_epochs=10
      - training_config.learning_rate_scheduling.lr_max=5.0e-05
      # write the _latest checkpoint within each 256-batch mini-epoch so chain parts can resume
      - train_logging.checkpoint=128
    chain_jobs: 6
    nodes: 8
