# Rerun of pfanchnd (B') from anchor_nodrop.yml, identical stage. The first launch (jtdfoc8c,
# pipeline ped2nqpa) deadlocked at the first training log: the number of scored steps depends on
# the drawn number of rollout steps (8 or 16 with the anchor), which differed between ranks, and
# the loss logging did one all-reduce per loss key. Fixed in prepare_losses_for_logging.
# Launch from the WeatherGenerator root:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-10-19/anchor_nodrop_pfanch_rerun.yml
parallelize: true
stages:
  - name: pfanchnd
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
      - ./config/config_long_rollout_anchor.yml
      - ./config/config_fe_no_dropout.yml
    options:
      - load_chkpt.run_id=nhv6tkln
      - load_chkpt.mini_epoch=8
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=5
    chain_jobs: 2
    nodes: 8
