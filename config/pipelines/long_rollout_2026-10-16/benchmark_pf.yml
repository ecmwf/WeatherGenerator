# Pushforward benchmark after the autocast-cache fix (2af40f93). In benchmark_fix.yml, bpf40
# crashed with a CheckpointError: the no_grad pushforward steps cached bf16 weight casts without
# autograd history in the autocast region (DDP, fp32 weights), see
# utils/rollout.autocast_cache_disabled. bpf40crps ran out of memory without step checkpointing.
# Both now with step checkpointing (default of config_long_rollout_pushforward.yml), as planned
# for the real runs B and C; gives their throughput and memory.
#   bpf40ckpt    : 40 steps, gradient and loss on the last 8 (pushforward), MSE
#   bpf40crpsckpt: bpf40ckpt with CRPS, 2 MC-dropout members
# Launch from the WeatherGenerator root:
#   ../WeatherGenerator-private/hpc/launch-slurm.py --pipeline config/pipelines/long_rollout_2026-10-16/benchmark_pf.yml
parallelize: true
stages:
  - name: bpf40ckpt
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
    options:
      - load_chkpt.run_id=nhv6tkln
      - load_chkpt.mini_epoch=8
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=1
      - training_config.samples_per_mini_epoch=96
      - validation_config.samples_per_mini_epoch=8
      - train_logging.terminal=4
      - training_config.forecast.policy=fixed
      - training_config.forecast.num_steps=40
    chain_jobs: 1
    nodes: 1
    slurm_args: ["--time=01:00:00"]

  - name: bpf40crpsckpt
    stage: train
    base_config: ./config/config_nhv6tkln_chkpt8_base.yml
    config_files:
      - ./config/config_gjl_repro_finetune_forecast_n320_rollout_8_nodes.yml
      - ./config/config_long_rollout_pushforward.yml
      - ./config/config_long_rollout_crps.yml
    options:
      - load_chkpt.run_id=nhv6tkln
      - load_chkpt.mini_epoch=8
      - streams_directory=./config/streams/gjl6a0kb_reproduction_n320_new_channels_forecast_iasi_channels_mnt_cw/
      - fe_impute_latent_noise_std=1.0e-05
      - training_config.num_mini_epochs=1
      - training_config.samples_per_mini_epoch=96
      - validation_config.samples_per_mini_epoch=8
      - train_logging.terminal=4
      - training_config.forecast.policy=fixed
      - training_config.forecast.num_steps=40
    chain_jobs: 1
    nodes: 1
    slurm_args: ["--time=01:00:00"]
