# Target for fine-tuning sdnbfpve towards the operational analysis on its own years
# (train 2016-2022, validate 2023): the analysis store with its own statistics, as the
# 2025-26 fine-tune. In 2016..2024-05 the store is plain od/0001, so sp is the real
# surface field and keeps sdnbfpve's weight (the 2025-26 fine-tune set it to 0: lnsp-
# derived sp in its research-experiment segments). strd/ssrd 0 (6-h accumulations here,
# 1-h in ERA5); z_* 100, t_* 20, msl 50, 2t 30 (rkl3g2o9's weights); the rest
# sdnbfpve's. q_10, absent from the store, is NaN (fill_missing_channels, masked).
